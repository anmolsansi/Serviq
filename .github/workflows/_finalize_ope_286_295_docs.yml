name: Finalize OPE 286-295 docs

on:
  push:
    branches:
      - docs-ope-286-295-final-reconciliation

permissions:
  contents: write

jobs:
  append-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: docs-ope-286-295-final-reconciliation

      - name: Append final implementation documentation
        env:
          DEDICATED_APPEND_B64: "...32908 chars truncated..." 
          BUILD_APPEND_B64: "...13464 chars truncated..."
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          updates = [
              (
                  Path("docs/OPE_286_295_IMPLEMENTATION_GUIDE.md"),
                  "# OPE-289 — Create provider and model metadata migration",
                  os.environ["DEDICATED_APPEND_B64"],
              ),
              (
                  Path("docs/SERVIQ_BUILD_GUIDE.md"),
                  "# OPE-286 through OPE-295 — final implementation reconciliation",
                  os.environ["BUILD_APPEND_B64"],
              ),
          ]
          for path, marker, encoded in updates:
              existing = path.read_text(encoding="utf-8")
              if marker in existing:
                  continue
              addition = base64.b64decode(encoded).decode("utf-8")
              path.write_text(existing.rstrip() + "\n\n" + addition.lstrip(), encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/OPE_286_295_IMPLEMENTATION_GUIDE.md docs/SERVIQ_BUILD_GUIDE.md
          git rm .github/workflows/_finalize_ope_286_295_docs.yml
          git commit -m "docs: finalize OPE-286 through OPE-295 implementation record"
          git push
