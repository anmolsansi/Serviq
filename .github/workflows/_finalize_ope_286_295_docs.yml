name: Finalize OPE 286-295 docs

on:
  push:
    branches:
      - docs-ope-286-295-final-reconciliation

permissions:
  contents: write

jobs:
  append-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: docs-ope-286-295-final-reconciliation

      - name: Append staged Markdown fragments and clean helpers
        run: |
          set -euo pipefail
          detailed="docs/OPE_286_295_IMPLEMENTATION_GUIDE.md"
          build="docs/SERVIQ_BUILD_GUIDE.md"
          fragments=".github/ope-286-295-doc-fragments"

          if ! grep -Fq '# OPE-289 — Create provider and model metadata migration' "$detailed"; then
            printf '\n\n' >> "$detailed"
            for part in "$fragments"/0*.md; do
              cat "$part" >> "$detailed"
              printf '\n' >> "$detailed"
            done
          fi

          if ! grep -Fq '# OPE-286 through OPE-295 — final implementation reconciliation' "$build"; then
            printf '\n\n' >> "$build"
            cat "$fragments/10-build-guide.md" >> "$build"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$detailed" "$build"
          git rm -r "$fragments"
          git rm -f .github/.ope-286-295-doc-trigger || true
          git rm .github/workflows/_finalize_ope_286_295_docs.yml
          git commit -m 'docs: finalize OPE-286 through OPE-295 implementation record'
          git push
