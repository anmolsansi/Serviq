name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.6'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/*/uv.lock

      # Keep CI on the same high-level command surface contributors use locally.
      - name: Install dependencies
        run: make setup

      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      - name: Test
        run: make test

      - name: Validate Compose configuration
        run: docker compose -f infra/docker/compose.yml --profile "*" config --no-interpolate

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-bookworm
        env:
          POSTGRES_DB: serviq
          POSTGRES_USER: serviq
          POSTGRES_PASSWORD: serviq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U serviq -d serviq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SERVIQ_DATABASE_INTEGRATION: "1"
      SERVIQ_ENV: test
      SERVIQ_PUBLIC_BASE_URL: http://localhost:3000
      SERVIQ_API_BASE_URL: http://localhost:8000
      DATABASE_URL: postgresql://serviq:serviq@localhost:5432/serviq
      VALKEY_URL: valkey://localhost:6379/0
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      OBJECT_STORAGE_ENDPOINT: http://localhost:8333
      OBJECT_STORAGE_BUCKET: serviq-test
      OBJECT_STORAGE_ACCESS_KEY: test-placeholder
      OBJECT_STORAGE_SECRET_KEY: test-placeholder
      OIDC_ISSUER_URL: http://localhost:8080/realms/serviq
      OIDC_CLIENT_ID: serviq-test
      OIDC_CLIENT_SECRET: test-placeholder
      OIDC_REDIRECT_URI: http://localhost:3000/auth/callback
      SESSION_SECRET: test-placeholder
      LLM_GATEWAY_URL: http://localhost:8100
      LLM_GATEWAY_INTERNAL_TOKEN: test-placeholder
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
      LOG_LEVEL: INFO
      SERVIQ_LOCAL_WEBHOOK_ALLOWLIST: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.6'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - name: Install frozen API environment
        run: cd services/api && uv sync --frozen

      - name: Upgrade clean database to migration head
        run: cd services/api && uv run alembic upgrade head

      - name: Run real PostgreSQL integration tests
        run: cd services/api && uv run pytest tests/integration

      - name: Downgrade invitation schema to previous revision
        run: cd services/api && uv run alembic downgrade 20260814_0002

      - name: Upgrade invitation schema again to prove reversibility
        run: cd services/api && uv run alembic upgrade head

      - name: Downgrade full migration chain to base
        run: cd services/api && uv run alembic downgrade base

  object-storage-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVIQ_OBJECT_STORAGE_INTEGRATION: "1"
      SERVIQ_ENV: test
      SERVIQ_PUBLIC_BASE_URL: http://localhost:3000
      SERVIQ_API_BASE_URL: http://localhost:8000
      DATABASE_URL: postgresql://serviq:test@localhost:5432/serviq
      VALKEY_URL: valkey://localhost:6379/0
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      OBJECT_STORAGE_ENDPOINT: http://localhost:8333
      OBJECT_STORAGE_BUCKET: serviq-local-objects
      OBJECT_STORAGE_ACCESS_KEY: serviq-local
      OBJECT_STORAGE_SECRET_KEY: serviq-local-dev-only
      OIDC_ISSUER_URL: http://localhost:8080/realms/serviq
      OIDC_CLIENT_ID: serviq-test
      OIDC_CLIENT_SECRET: test-placeholder
      OIDC_REDIRECT_URI: http://localhost:3000/auth/callback
      SESSION_SECRET: test-placeholder
      LLM_GATEWAY_URL: http://localhost:8100
      LLM_GATEWAY_INTERNAL_TOKEN: test-placeholder
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
      LOG_LEVEL: INFO
      SERVIQ_LOCAL_WEBHOOK_ALLOWLIST: ""
      KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD: test-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.6'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - name: Install frozen API environment
        run: cd services/api && uv sync --frozen

      - name: Start local S3-compatible storage
        run: docker compose -f infra/docker/compose.yml up -d object-storage

      - name: Wait for local S3-compatible storage
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --output /dev/null http://localhost:8333/; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f infra/docker/compose.yml logs object-storage
          exit 1

      - name: Run real object-storage integration test
        run: cd services/api && uv run pytest tests/integration/test_object_storage_integration.py

      - name: Stop local S3-compatible storage
        if: always()
        run: docker compose -f infra/docker/compose.yml down --volumes

  ope302-build-guide-finalizer:
    if: github.event_name == 'pull_request' && github.head_ref == 'ope302'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out OPE-302 branch
        uses: actions/checkout@v4
        with:
          ref: ope302
          fetch-depth: 0

      - name: Append OPE-302 cumulative documentation
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^## OPE-302 — URL and sitemap knowledge-source registration$' docs/SERVIQ_BUILD_GUIDE.md; then
            echo 'OPE-302 section already exists.'
            exit 0
          fi
          cat >> docs/SERVIQ_BUILD_GUIDE.md <<'EOF'

## OPE-302 — URL and sitemap knowledge-source registration

**Implemented on branch:** `ope302`  
**Linear ticket:** `OPE-302`

### What problem this ticket solves

OPE-300 created the relational knowledge schema, but there was still no API for an authorized tenant administrator to register a public website or sitemap as a Serviq knowledge source. OPE-302 adds that control-plane boundary without starting ingestion.

The API now exposes exactly the OPE-302 surface:

```text
GET  /api/v1/knowledge-sources
POST /api/v1/knowledge-sources
```

POST accepts only URL-backed source metadata:

```text
sourceType  = url | sitemap
name        = trimmed, 1 to 160 characters
sourceUri   = absolute HTTPS URL
accessScope = customer | internal
```

Unknown request fields are rejected rather than silently ignored.

### URL validation and why create does not crawl

Registration validates URL syntax before persistence. Requests are rejected when they use HTTP or another non-HTTPS scheme such as `file:`, `ftp:`, `data:`, or `javascript:`, contain embedded username/password credentials, contain a fragment, have malformed host/port syntax, or contain whitespace/control characters.

OPE-302 deliberately does not perform DNS resolution, private-IP classification, redirects, HTTP fetching, robots checks, sitemap parsing, chunking, embeddings, or vector work. Those controls belong to the future crawler/ingestion boundary where an outbound network request actually occurs. Doing them here would mix metadata registration with SSRF-sensitive network behavior that this ticket explicitly excludes.

### Metadata-only creation

A successful POST creates one tenant-owned `knowledge_sources` row with server-controlled lifecycle values:

```text
status          = pending
sync_version    = 0
object_key      = NULL
last_synced_at  = NULL
last_error_code = NULL
```

The creator comes from the authenticated server-side workforce principal. The browser cannot choose another creator or tenant.

There is no HTTP client, crawler, parser, embedding call, object-storage write, or background ingestion trigger in the create service. The row simply records that an approved source should exist and is waiting for later synchronization work.

### Tenant isolation

Both GET and POST use the trusted `serviq_tenant_id` request principal established by the authentication/tenancy foundation. There is no tenant ID request field or tenant query parameter for a caller to override.

The repository list query includes `knowledge_sources.tenant_id = current_tenant_id`. The integration test uses the shared V1.1.14 tenant-isolation harness to seed two tenants and prove the list endpoint returns only the current tenant's records.

### Capability-based authorization

OPE-302 adds the permission:

```text
knowledge.sources.manage
```

Alembic revision `20260819_0009_knowledge_permissions.py` seeds that capability onto the existing global workforce `owner` and `admin` system roles.

The runtime service does not hard-code role names such as `Knowledge Manager`. It asks OPE-282's effective-capability resolver whether the current active tenant membership contains `knowledge.sources.manage`. A future tenant Knowledge Manager role can therefore receive the capability through normal RBAC configuration without changing the route implementation.

A workforce user without the capability receives a safe 403 response. Missing or inactive tenant membership also fails closed through the same authorization boundary.

### Safe list response

GET returns browser-safe knowledge metadata only:

```text
id
sourceType
name
sourceUri
accessScope
status
syncVersion
lastSyncedAt
lastErrorCode
createdAt
updatedAt
```

It does not expose `objectKey`, `createdBy`, storage internals, credentials, or secret values.

The response model supports all five architecture-approved knowledge source types and permits `sourceUri = null`. That keeps the list endpoint compatible with future PDF/Markdown/text sources, whose storage-backed records use `object_key` instead of a URL, while OPE-302 POST remains intentionally restricted to `url | sitemap`.

### Tests added

`services/api/tests/test_knowledge_source_schemas.py` covers strict validation, including valid trimming and rejection of unsafe schemes, malformed URLs, credentials, fragments, invalid source types/scopes, blank or oversized names, and unknown fields.

`services/api/tests/integration/test_knowledge_sources_api.py` uses the real PostgreSQL integration environment and the shared tenant-isolation harness. It covers valid URL creation, valid sitemap creation, `pending` plus `sync_version = 0`, null object-storage state, tenant isolation, unauthorized access, safe response fields, and request validation at the HTTP boundary.

The integration test also replaces the default `httpx` outbound transport with a guard that raises immediately. API calls use FastAPI's in-process ASGI transport, so the test fails if knowledge-source registration starts an ordinary outbound HTTP request. This protects the OPE-302 rule that create is metadata-only.

`services/api/tests/integration/test_knowledge_permissions.py` verifies that the RBAC migration grants `knowledge.sources.manage` to the existing Owner and Admin system roles.

### Main files changed

```text
services/api/alembic/versions/20260819_0009_knowledge_permissions.py
services/api/app/modules/knowledge/__init__.py
services/api/app/modules/knowledge/models.py
services/api/app/modules/knowledge/repository.py
services/api/app/modules/knowledge/schemas.py
services/api/app/modules/knowledge/errors.py
services/api/app/modules/knowledge/service.py
services/api/app/modules/knowledge/router.py
services/api/app/main.py
services/api/tests/test_knowledge_source_schemas.py
services/api/tests/integration/test_knowledge_sources_api.py
services/api/tests/integration/test_knowledge_permissions.py
docs/SERVIQ_BUILD_GUIDE.md
```

### What this improves

For a Serviq administrator, knowledge setup can now begin through a real tenant-scoped API instead of direct database writes.

For security, the browser cannot choose a tenant, source creator, arbitrary URL scheme, credentials-in-URL, or lifecycle state. Authorization is capability-based and tenant-scoped, and normal list responses omit storage internals.

For reliability, registration cannot accidentally become a slow crawler request. It writes a small metadata row and leaves expensive or SSRF-sensitive network work to the dedicated ingestion system that will own those controls.

For future engineering, file-backed knowledge sources can coexist with the same GET projection without changing the URL/sitemap create contract.

### What OPE-302 intentionally leaves for later

This ticket does not implement website crawling, sitemap fetching/parsing, DNS/private-network SSRF protection for outbound fetches, redirect rules, robots/allowlist policy, file uploads, document parsing, chunking, embeddings, vector indexing, synchronization jobs, knowledge-source edit/disable routes, or customer-answer retrieval.

Those remain separate tickets and must reuse this tenant/RBAC/source foundation instead of expanding OPE-302 into an ingestion worker.

### Completion and validation rule

The implementation is complete on `ope302` only after the final branch head, including this cumulative documentation update, passes the repository's normal CI/security checks and real PostgreSQL integration/migration coverage. Until that exact head is validated and merged, the ticket should not be represented as merged production behavior on `main`.
EOF

      - name: Commit cumulative documentation
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/SERVIQ_BUILD_GUIDE.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/SERVIQ_BUILD_GUIDE.md
          git commit -m 'OPE-302: document knowledge source registration'
          git push origin HEAD:ope302
