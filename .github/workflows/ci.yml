name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: v1.0.26
          fetch-depth: 0

      - name: Restore and append V1.0.26 build guide
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- docs/SERVIQ_BUILD_GUIDE.md
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/SERVIQ_BUILD_GUIDE.md')
          text = path.read_text()
          marker = '# V1.0.26 — Reproducible LLM gateway dependencies and Python audits'
          if marker not in text:
              section = r'''

---

# V1.0.26 — Reproducible LLM gateway dependencies and Python audits

**GitHub parent issue:** #166  
**Implementation issues:** #167, #168, #169, #170  
**Integration branch:** `v1.0.26`

## Why this ticket exists

Serviq already had committed `uv.lock` files for the API and worker, but the LLM gateway still resolved dependencies directly from `pyproject.toml` during setup and vulnerability auditing. That meant compatible transitive versions could change over time even when no Serviq source code changed. The audit path also used `uvx` without selecting an interpreter, so the isolated `pip-audit` tool environment could choose a Python version other than Serviq's required Python 3.14.

V1.0.26 removes both sources of dependency drift. It changes developer, CI, security, and release reliability only. Provider adapters, model names, API schemas, database contracts, authentication, tenant boundaries, prompts, and customer-facing runtime behavior remain unchanged.

## The LLM gateway now owns a committed lock

The new `services/llm-gateway/uv.lock` was generated in GitHub Actions under Python 3.14.6 from the gateway's existing dependency declarations and validated with `uv lock --check` before commit. The gateway `pyproject.toml` was not changed, so this ticket freezes the already-approved provider SDK contract rather than upgrading providers.

A committed lock freezes the complete resolved graph, including transitive packages and hashes. This gives the gateway the same dependency model already used by the API and worker.

## Lock freshness is a required preflight

The root `Makefile` now defines `dependency-lock-check`. It runs `uv lock --check` in the API, worker, and LLM gateway directories. Both `make setup` and `make security` depend on that target.

This is separate from frozen installation for an important reason. `--frozen` tells uv to consume the existing lock without changing it. `uv lock --check` proves the lock still agrees with `pyproject.toml`. If a dependency declaration changes without a matching lock update, Serviq now fails at the dependency boundary instead of silently repairing or ignoring the mismatch.

## Setup and audit exports are frozen

All three Python services now use `uv sync --frozen` during `make setup`. The API, worker, and LLM gateway vulnerability exports all use `uv export --frozen --no-dev`.

Normal setup and security commands therefore consume reviewed lock state. They are not allowed to create or rewrite lockfiles as a side effect.

## `pip-audit` always uses Python 3.14

Every Python dependency audit now runs the equivalent of:

```text
uvx --python 3.14 --from pip-audit==2.10.1 pip-audit ...
```

The explicit `--python 3.14` controls the separate `uvx` tool environment. A machine that also has Python 3.13 installed can no longer change the scanner interpreter through local discovery order. The audit tool itself remains pinned at version 2.10.1.

## CI verifies dependency setup leaves Git clean

The CI quality job runs `make setup` and immediately checks `git status --porcelain`. If setup generates or modifies any repository file, CI prints the dirty status and fails before lint, type checking, or tests.

This catches future regressions such as removing `--frozen`, forgetting to commit a lockfile, or introducing another dependency command that rewrites tracked state.

## Security keeps non-zero failure behavior

The Security dependency job now validates all three Python locks before auditing. Each Python export is frozen and each `pip-audit` invocation explicitly selects Python 3.14. Existing JSON reports are still uploaded and the final audit-status enforcement remains unchanged.

V1.0.26 does not suppress a real vulnerability, add an ignore entry, or convert a failing audit into a warning.

## Release paths use the same dependency contract

The foundation, manual, and tag-driven release jobs continue to use `make setup`. Each release path now checks the worktree immediately after dependency installation and refuses to continue if setup changed repository state.

No release tag, version rule, label behavior, token permission, or published release history changes. In particular, the existing `v0.1.0-alpha.1` release is not moved or republished.

## Contributor workflow

`CONTRIBUTING.md` now documents that every Python service owns a committed lock and requires Python 3.14.x. Contributors can run `make dependency-lock-check` without installing dependencies. An intentional dependency change must update the owning `pyproject.toml`, regenerate the matching `uv.lock` under Python 3.14, review both, and commit them together.

## What this improves

- Development installs become deterministic across clean checkouts.
- Security evidence is based on frozen dependency sets and a deterministic Python interpreter.
- Release preparation cannot quietly mutate dependency state.
- Stale dependency metadata fails early with a focused error instead of surfacing later during provider tests or release work.

## Validation evidence

The gateway lock bootstrap completed in GitHub Actions under Python 3.14.6 and successfully passed `uv lock --check`. The final branch is validated through Serviq's normal CI and Security workflows, covering frozen setup, clean-worktree verification, lint, type checking, tests, Compose configuration, CodeQL, Gitleaks, Trivy, frozen dependency exports, Python 3.14 `pip-audit`, report artifacts, and non-zero audit enforcement.

The stale-lock negative case is exercised on temporary copied gateway dependency metadata so the real branch does not need to be intentionally dirtied. Editing the copied `pyproject.toml` without updating its copied lock must make `uv lock --check` return non-zero.

`make e2e` and `make load-test` remain intentional non-zero placeholders and are not claimed as passing evidence for this ticket.

## Existing repository-context discrepancy

During implementation, we confirmed that `services/api/uv.lock` and `services/worker/uv.lock` already exist even though one sentence in `docs/repo_context.md` still says there is no committed Python lockfile. That sentence is stale documentation. `docs/repo_context.md` is outside the approved V1.0.26 file list, so this focused ticket records the discrepancy rather than widening scope.

## Completion rule

V1.0.26 is complete only when the final `v1.0.26` head contains the committed gateway lock, frozen setup/export paths, explicit Python 3.14 audit selection, CI/Security/Release enforcement, contributor documentation, and this cumulative implementation record, and that exact head passes CI and Security before merge. The GitHub issues close only after the merged `main` result and post-merge workflows are verified.
'''
              path.write_text(text.rstrip() + section + '\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SERVIQ_BUILD_GUIDE.md
          if ! git diff --cached --quiet; then
            git commit -m "V1.0.26.4: document reproducible dependency workflow"
            git push origin HEAD:v1.0.26
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.6'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/*/uv.lock

      # Keep CI on the same high-level command surface contributors use locally.
      - name: Install dependencies
        run: make setup

      - name: Verify dependency setup leaves checkout clean
        shell: bash
        run: |
          status="$(git status --porcelain)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            echo "Dependency setup modified the checkout."
            exit 1
          fi

      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      - name: Test
        run: make test

      - name: Validate Compose configuration
        run: docker compose -f infra/docker/compose.yml --profile "*" config --no-interpolate

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-bookworm
        env:
          POSTGRES_DB: serviq
          POSTGRES_USER: serviq
          POSTGRES_PASSWORD: serviq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U serviq -d serviq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SERVIQ_DATABASE_INTEGRATION: "1"
      SERVIQ_ENV: test
      SERVIQ_PUBLIC_BASE_URL: http://localhost:3000
      SERVIQ_API_BASE_URL: http://localhost:8000
      DATABASE_URL: postgresql://serviq:serviq@localhost:5432/serviq
      VALKEY_URL: valkey://localhost:6379/0
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      OBJECT_STORAGE_ENDPOINT: http://localhost:8333
      OBJECT_STORAGE_BUCKET: serviq-test
      OBJECT_STORAGE_ACCESS_KEY: test-placeholder
      OBJECT_STORAGE_SECRET_KEY: test-placeholder
      OIDC_ISSUER_URL: http://localhost:8080/realms/serviq
      OIDC_CLIENT_ID: serviq-test
      OIDC_CLIENT_SECRET: test-placeholder
      OIDC_REDIRECT_URI: http://localhost:3000/auth/callback
      SESSION_SECRET: test-placeholder
      LLM_GATEWAY_URL: http://localhost:8100
      LLM_GATEWAY_INTERNAL_TOKEN: test-placeholder
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
      LOG_LEVEL: INFO
      SERVIQ_LOCAL_WEBHOOK_ALLOWLIST: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.6'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - name: Install frozen API environment
        run: cd services/api && uv sync --frozen

      - name: Upgrade clean database to migration head
        run: cd services/api && uv run alembic upgrade head

      - name: Run real PostgreSQL integration tests
        run: cd services/api && uv run pytest tests/integration

      - name: Downgrade invitation schema to previous revision
        run: cd services/api && uv run alembic downgrade 20260814_0002

      - name: Upgrade invitation schema again to prove reversibility
        run: cd services/api && uv run alembic upgrade head

      - name: Downgrade full migration chain to base
        run: cd services/api && uv run alembic downgrade base

  object-storage-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVIQ_OBJECT_STORAGE_INTEGRATION: "1"
      SERVIQ_ENV: test
      SERVIQ_PUBLIC_BASE_URL: http://localhost:3000
      SERVIQ_API_BASE_URL: http://localhost:8000
      DATABASE_URL: postgresql://serviq:test@localhost:5432/serviq
      VALKEY_URL: valkey://localhost:6379/0
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      OBJECT_STORAGE_ENDPOINT: http://localhost:8333
      OBJECT_STORAGE_BUCKET: serviq-local-objects
      OBJECT_STORAGE_ACCESS_KEY: serviq-local
      OBJECT_STORAGE_SECRET_KEY: serviq-local-dev-only
      OIDC_ISSUER_URL: http://localhost:8080/realms/serviq
      OIDC_CLIENT_ID: serviq-test
      OIDC_CLIENT_SECRET: test-placeholder
      OIDC_REDIRECT_URI: http://localhost:3000/auth/callback
      SESSION_SECRET: test-placeholder
      LLM_GATEWAY_URL: http://localhost:8100
      LLM_GATEWAY_INTERNAL_TOKEN: test-placeholder
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
      LOG_LEVEL: INFO
      SERVIQ_LOCAL_WEBHOOK_ALLOWLIST: ""
      KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD: test-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.6'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - name: Install frozen API environment
        run: cd services/api && uv sync --frozen

      - name: Start local S3-compatible storage
        run: docker compose -f infra/docker/compose.yml up -d object-storage

      - name: Wait for local S3-compatible storage
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --output /dev/null http://localhost:8333/; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f infra/docker/compose.yml logs object-storage
          exit 1

      - name: Run real object-storage integration test
        run: cd services/api && uv run pytest tests/integration/test_object_storage_integration.py

      - name: Stop local S3-compatible storage
        if: always()
        run: docker compose -f infra/docker/compose.yml down --volumes
