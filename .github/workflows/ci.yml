name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.6'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/*/uv.lock

      # Keep CI on the same high-level command surface contributors use locally.
      - name: Install dependencies
        run: make setup

      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      - name: Test
        run: make test

      - name: Validate Compose configuration
        run: docker compose -f infra/docker/compose.yml --profile "*" config --no-interpolate

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-bookworm
        env:
          POSTGRES_DB: serviq
          POSTGRES_USER: serviq
          POSTGRES_PASSWORD: serviq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U serviq -d serviq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SERVIQ_DATABASE_INTEGRATION: "1"
      SERVIQ_ENV: test
      SERVIQ_PUBLIC_BASE_URL: http://localhost:3000
      SERVIQ_API_BASE_URL: http://localhost:8000
      DATABASE_URL: postgresql://serviq:serviq@localhost:5432/serviq
      VALKEY_URL: valkey://localhost:6379/0
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      OBJECT_STORAGE_ENDPOINT: http://localhost:8333
      OBJECT_STORAGE_BUCKET: serviq-test
      OBJECT_STORAGE_ACCESS_KEY: test-placeholder
      OBJECT_STORAGE_SECRET_KEY: test-placeholder
      OIDC_ISSUER_URL: http://localhost:8080/realms/serviq
      OIDC_CLIENT_ID: serviq-test
      OIDC_CLIENT_SECRET: test-placeholder
      OIDC_REDIRECT_URI: http://localhost:3000/auth/callback
      SESSION_SECRET: test-placeholder
      LLM_GATEWAY_URL: http://localhost:8100
      LLM_GATEWAY_INTERNAL_TOKEN: test-placeholder
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
      LOG_LEVEL: INFO
      SERVIQ_LOCAL_WEBHOOK_ALLOWLIST: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.6'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - name: Install frozen API environment
        run: cd services/api && uv sync --frozen

      - name: Upgrade clean database to migration head
        run: cd services/api && uv run alembic upgrade head

      - name: Run real PostgreSQL integration tests
        run: cd services/api && uv run pytest tests/integration

      - name: Downgrade invitation schema to previous revision
        run: cd services/api && uv run alembic downgrade 20260814_0002

      - name: Upgrade invitation schema again to prove reversibility
        run: cd services/api && uv run alembic upgrade head

      - name: Downgrade full migration chain to base
        run: cd services/api && uv run alembic downgrade base

  ope299-documentation:
    if: github.event_name == 'pull_request' && github.head_ref == 'ope299'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out OPE-299 branch
        uses: actions/checkout@v4
        with:
          ref: ope299

      - name: Append OPE-299 cumulative documentation
        shell: bash
        run: |
          set -euo pipefail

          if grep -Fq '# OPE-299 — Model configuration CRUD and stable aliases' docs/SERVIQ_BUILD_GUIDE.md; then
            exit 0
          fi

          cat <<'EOF' >> docs/SERVIQ_BUILD_GUIDE.md

---

# OPE-299 — Model configuration CRUD and stable aliases

**Status:** Implemented on branch `ope299` and reviewed through PR #145. This section explains the implementation in plain language so a non-technical reader can understand what changed, how it works, and why the design matters.

## What problem OPE-299 solves

AI providers use their own model names. If every Serviq agent stored a raw provider string such as `gpt-5-mini` directly in business configuration, the whole product would become tied to that provider-specific name. Replacing a provider or moving to a newer upstream model could then require editing many separate agent configurations.

OPE-299 adds a Serviq-owned model catalog. A tenant can create a stable configuration such as:

```text
alias = support-primary
purpose = generation
provider connection = the tenant's approved OpenAI connection
upstream model = gpt-5-mini
```

Future Serviq agent/domain code can refer to the model configuration UUID or stable alias instead of importing provider SDK objects or scattering raw provider model names through the product.

A simple analogy is a phone contact. You save a person under a stable name instead of asking everyone to memorize the current phone number. When the number changes, the contact can be updated in one place. A Serviq model alias provides the same kind of indirection for AI models.

## Why the earlier OPE-299 implementation stopped

The `model_configurations` database table already existed, so basic create, list, update, and delete code would have been easy to write. The hard part was safe deletion.

The ticket requires deletion to fail when a published agent or another production configuration still depends on a model. Earlier, the repository had no authoritative reference that could answer that question. The future `agent_versions.config` JSON shape had not frozen an exact model-reference field or path.

Deleting anyway would falsely claim production safety. Inventing an agent JSON path inside a model-management ticket would also be wrong because one module would silently define another module's architecture.

That is why the previous attempt recorded a `Needs Architect Decision` blocker instead of shipping partial CRUD.

## How the architecture blocker was resolved

OPE-299 now includes `docs/architecture-decisions/ADR-015-model-configuration-reference-and-mutation-semantics.md`.

ADR means Architecture Decision Record. It records an important engineering rule in Git so future developers can understand not only what the code does, but why.

ADR-015 freezes these rules:

- the model configuration UUID is the authoritative internal identity;
- the alias is a stable tenant-facing name and is immutable after creation;
- purpose is immutable after creation;
- provider connection, upstream model, and enabled state are the PATCH-mutable fields;
- creation requires a provider connection owned by the same tenant and currently marked `active`;
- changing provider/upstream model or enabling a model also requires an active provider;
- disabling remains allowed even if the provider later becomes unhealthy, because disabling is the safe action;
- production dependencies are recorded in a small relational reference registry instead of forcing model management to parse another module's JSON.

This resolves the earlier stop condition without inventing the future agent configuration schema.

## The new model reference registry

The migration adds:

```text
model_configuration_references
```

Think of this as a “do not delete, something important is using this” register.

A blocking row records the current tenant, the model-configuration UUID, a short reference type, and the UUID of the production object that depends on it.

A future published-agent workflow might register a dependency that conceptually means:

```text
Tenant A
Model = support-primary UUID
Reference kind = published agent version
Reference ID = published agent-version UUID
```

When an administrator tries to delete the model, OPE-299 does not inspect agent JSON. It asks the database whether a blocking reference exists:

```text
No blocking reference -> deletion may continue
Blocking reference exists -> 409 MODEL_CONFIGURATION_IN_USE
```

The database uses a composite tenant/model foreign key so a bad internal write cannot register Tenant A as depending on Tenant B's model UUID.

Future domain modules remain responsible for creating or removing their own blocking registry row in the same transaction in which their production reference becomes active or inactive.

## Why alias and purpose cannot be changed by PATCH

The word stable matters. If an administrator creates `support-primary` and normal PATCH could casually rename it, older logs, audits, configuration reviews, and future alias-based references would become harder to interpret.

Changing purpose is even more dangerous. Turning a `generation` configuration into an `embedding` configuration changes the meaning of the resource. Downstream code expecting generated language should not suddenly receive a vector-model configuration.

The rules are therefore:

```text
Immutable after create:
- alias
- purpose

PATCH-mutable:
- providerConnectionId
- upstreamModel
- enabled
```

A future alias-renaming or purpose-migration feature would need its own impact analysis rather than being hidden inside routine editing.

## Why provider status must be active

Provider connections can be `untested`, `active`, `invalid`, or `disabled`. OPE-298 added the connectivity-test workflow that can prove a credential works and mark it active.

A model alias is supposed to point at usable AI infrastructure. Creating an enabled alias against an untested, invalid, or disabled provider would create configuration that looks valid to an administrator but cannot be trusted to run.

OPE-299 therefore requires an active provider for creation. It also requires an active provider when changing the provider connection, changing the upstream model, or setting `enabled=true`.

There is one deliberate exception. Setting `enabled=false` remains allowed even if the provider is unhealthy. An administrator must always be able to fail safe by disabling a model.

## API routes implemented

The public API now matches the frozen architecture exactly:

```text
GET    /api/v1/models
POST   /api/v1/models
PATCH  /api/v1/models/{modelConfigurationId}
DELETE /api/v1/models/{modelConfigurationId}
```

`GET /api/v1/models` returns only model configurations owned by the current tenant.

`POST /api/v1/models` accepts `providerConnectionId`, `alias`, `upstreamModel`, `purpose`, and `enabled`. Alias is trimmed and must be 1–80 characters. Upstream model is trimmed and must be 1–160 characters. Purpose must be exactly `generation`, `embedding`, or `rerank`. Unknown fields are rejected.

`PATCH /api/v1/models/{modelConfigurationId}` accepts only `providerConnectionId`, `upstreamModel`, and `enabled`. An empty PATCH is rejected. Alias and purpose are rejected because they are not mutable fields.

`DELETE /api/v1/models/{modelConfigurationId}` locks the model row, checks the reference registry, returns HTTP 409 when the model is still referenced, and returns HTTP 204 after deleting an unreferenced model. It never silently cascades through production configuration.

## Tenant-unique aliases

The database already enforces `UNIQUE(tenant_id, alias)`. OPE-299 turns that rule into deterministic API behavior.

Two `support-primary` aliases inside one tenant conflict and return `409 MODEL_ALIAS_CONFLICT`. Two different tenants may each use `support-primary` because each tenant owns an independent catalog.

The database unique constraint remains the final protection when two requests race to create the same tenant alias concurrently.

## Tenant isolation and non-disclosure

Every model mutation query includes both the current tenant ID and the requested model UUID. Every provider selected by model CRUD is also looked up using the current tenant ID plus provider UUID.

If Tenant A submits Tenant B's provider or model UUID, Serviq behaves as though that resource does not exist for Tenant A. It does not disclose another tenant's resource ownership.

This is important because UUIDs are identifiers, not authorization. Knowing an ID must never grant access.

## Authorization

Model management uses the existing capability `ai.providers.manage`. A tenant user with that capability may manage provider/model control-plane configuration. A tenant member without it receives permission denied for model-management operations.

The integration tests verify unauthorized list, update, and delete behavior rather than testing only the successful administrator path.

## Secrets stay outside model responses

A model configuration needs the provider-connection ID, but it never needs to expose the provider credential itself.

Responses contain only safe model metadata:

```text
id
providerConnectionId
alias
upstreamModel
purpose
enabled
createdAt
updatedAt
```

They do not return API keys, `secretRef`, provider response bodies, provider headers, SDK exception objects, or provider SDK types.

This keeps the stable agent-facing model abstraction separate from credential storage and provider-specific implementation details.

## How the backend is divided

OPE-299 follows the existing Serviq backend structure:

```text
HTTP request
   |
   v
model_router.py
   |
   v
service.py
   |
   v
repository.py
   |
   v
PostgreSQL
```

`model_router.py` owns HTTP transport behavior and converts typed failures into safe status codes.

`schemas.py` owns strict request/response validation.

`service.py` owns authorization, provider eligibility, transaction boundaries, mutability rules, and deletion protection.

`repository.py` owns tenant-scoped SQLAlchemy queries.

`models.py` maps PostgreSQL tables into SQLAlchemy objects.

The Alembic migration owns the database evolution for the reference registry.

Keeping these responsibilities separate prevents business rules from being scattered through route handlers and raw SQL.

## Why PATCH and DELETE lock rows

Two administrators or processes can act at nearly the same time. For example, one request can start changing a model while another starts deleting it.

OPE-299 uses database row locking for model updates and deletes, and it locks a provider when a safety-sensitive provider eligibility decision is being made. These are short metadata transactions with no external provider/network call inside them.

This avoids decisions based on stale state without holding database locks during slow external work.

## Automated tests added

The real PostgreSQL integration suite covers:

- generation, embedding, and rerank creation;
- whitespace normalization;
- duplicate same-tenant alias conflict;
- the same alias in another tenant;
- blank and over-length alias rejection;
- blank and over-length upstream-model rejection;
- invalid purpose rejection;
- unknown field rejection;
- foreign-tenant provider rejection;
- disabled and untested provider rejection;
- tenant list isolation;
- authorized mutable-field update;
- rejection of alias/purpose PATCH;
- rejection of an empty PATCH;
- fail-safe disable behavior;
- rejection of re-enable when a provider is no longer active;
- foreign-model non-disclosure;
- unauthorized management behavior;
- referenced model deletion conflict;
- unreferenced model deletion success;
- absence of provider secret fields in model responses.

The tests use the real PostgreSQL integration environment but do not need live OpenAI, Anthropic, Gemini, or OpenRouter credentials.

## Files changed for OPE-299

The implementation includes:

```text
docs/architecture-decisions/ADR-015-model-configuration-reference-and-mutation-semantics.md
docs/architecture-blockers/OPE-299-model-reference-rules.md
services/api/alembic/versions/20260819_0007_model_configuration_references.py
services/api/app/modules/providers/models.py
services/api/app/modules/providers/repository.py
services/api/app/modules/providers/schemas.py
services/api/app/modules/providers/errors.py
services/api/app/modules/providers/service.py
services/api/app/modules/providers/model_router.py
services/api/app/main.py
services/api/tests/integration/test_model_configuration_crud_api.py
services/api/tests/integration/test_database_integration.py
```

This cumulative build guide is updated instead of creating a separate ticket-by-ticket implementation tutorial.

## What OPE-299 deliberately does not do

This ticket does not implement provider API-key rotation, provider connectivity testing, model fallback chains, the future agent configuration schema, agent publishing/deployment, model request execution inside the LLM Gateway, provider SDK selection, alias renaming, purpose mutation, or automatic migration of future agent configs.

Those concerns remain in their own modules and tickets.

## What this improves for Serviq

Before OPE-299, the database had model rows but Serviq did not have a production-safe tenant management API for them.

After OPE-299, Serviq has a tenant-scoped model catalog with stable aliases, strict validation, permission checks, active-provider eligibility, non-disclosing isolation, deterministic conflicts, and real reference-aware deletion.

The larger improvement is decoupling. Future agents can depend on a Serviq-owned model identity while provider credentials remain in the provider control plane and provider SDK behavior remains inside the LLM Gateway. A provider model can change without requiring every domain object to learn provider-specific naming conventions.

That is the difference between merely storing an AI model name and building a maintainable model-configuration layer.
EOF

