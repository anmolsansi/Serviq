name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify GitHub Actions use immutable references
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          full_commit_sha = re.compile(r"^[0-9a-fA-F]{40}$")
          docker_digest = re.compile(r"^docker://.+@sha256:[0-9a-fA-F]{64}$")
          uses_line = re.compile(r"^\s*(?:-\s*)?uses:\s*(.+?)\s*$")

          def is_immutable(reference: str) -> bool:
              if reference.startswith("./"):
                  return True
              if reference.startswith("docker://"):
                  return docker_digest.fullmatch(reference) is not None
              if "@" not in reference:
                  return False
              _, ref = reference.rsplit("@", 1)
              return full_commit_sha.fullmatch(ref) is not None

          # Keep both sides of the policy executable so a future edit cannot
          # accidentally weaken the predicate while leaving the scan green.
          assert is_immutable(
              "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
          )
          assert is_immutable("./.github/actions/example")
          assert is_immutable(
              "docker://ghcr.io/example/action@sha256:"
              + "a" * 64
          )
          assert not is_immutable("actions/checkout@v4")
          assert not is_immutable("docker://ghcr.io/example/action:latest")

          violations: list[str] = []
          workflow_dir = Path(".github/workflows")
          workflow_files = sorted(
              {
                  *workflow_dir.glob("*.yml"),
                  *workflow_dir.glob("*.yaml"),
              }
          )

          for workflow in workflow_files:
              for line_number, line in enumerate(
                  workflow.read_text(encoding="utf-8").splitlines(), start=1
              ):
                  match = uses_line.match(line)
                  if match is None:
                      continue

                  reference = match.group(1).split(" #", 1)[0].strip()
                  if (
                      len(reference) >= 2
                      and reference[0] in {"'", '"'}
                      and reference[-1] == reference[0]
                  ):
                      reference = reference[1:-1]

                  if not is_immutable(reference):
                      violations.append(
                          f"{workflow}:{line_number}: mutable uses reference: {reference}"
                      )

          if violations:
              print("GitHub Actions must use immutable commit SHAs or image digests.")
              print("\n".join(violations))
              raise SystemExit(1)

          print(
              f"Verified immutable action references across {len(workflow_files)} workflow files."
          )
          PY

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.6'

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: services/*/uv.lock

      # Keep CI on the same high-level command surface contributors use locally.
      - name: Install dependencies
        run: make setup

      - name: Verify dependency setup leaves checkout clean
        shell: bash
        run: |
          status="$(git status --porcelain)"
          if [[ -n "$status" ]]; then
            printf '%s\n' "$status"
            echo "Dependency setup modified the checkout."
            exit 1
          fi

      - name: Prove a stale gateway lock fails
        shell: bash
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          cp services/llm-gateway/pyproject.toml services/llm-gateway/uv.lock "$temp_dir"/
          sed -i 's/requires-python = ">=3.14,<3.15"/requires-python = ">=3.13,<3.15"/' "$temp_dir/pyproject.toml"
          if (cd "$temp_dir" && uv lock --check); then
            echo "Expected stale gateway lock validation to fail."
            exit 1
          fi

      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      - name: Test
        run: make test

      - name: Validate Compose configuration
        run: docker compose -f infra/docker/compose.yml --profile "*" config --no-interpolate

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-bookworm
        env:
          POSTGRES_DB: serviq
          POSTGRES_USER: serviq
          POSTGRES_PASSWORD: serviq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U serviq -d serviq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SERVIQ_DATABASE_INTEGRATION: "1"
      SERVIQ_ENV: test
      SERVIQ_PUBLIC_BASE_URL: http://localhost:3000
      SERVIQ_API_BASE_URL: http://localhost:8000
      DATABASE_URL: postgresql://serviq:serviq@localhost:5432/serviq
      VALKEY_URL: valkey://localhost:6379/0
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      OBJECT_STORAGE_ENDPOINT: http://localhost:8333
      OBJECT_STORAGE_BUCKET: serviq-test
      OBJECT_STORAGE_ACCESS_KEY: test-placeholder
      OBJECT_STORAGE_SECRET_KEY: test-placeholder
      OIDC_ISSUER_URL: http://localhost:8080/realms/serviq
      OIDC_CLIENT_ID: serviq-test
      OIDC_CLIENT_SECRET: test-placeholder
      OIDC_REDIRECT_URI: http://localhost:3000/auth/callback
      SESSION_SECRET: test-placeholder
      LLM_GATEWAY_URL: http://localhost:8100
      LLM_GATEWAY_INTERNAL_TOKEN: test-placeholder
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
      LOG_LEVEL: INFO
      SERVIQ_LOCAL_WEBHOOK_ALLOWLIST: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.6'

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - name: Install frozen API environment
        run: cd services/api && uv sync --frozen

      - name: Upgrade clean database to migration head
        run: cd services/api && uv run alembic upgrade head

      - name: Run real PostgreSQL integration tests
        run: cd services/api && uv run pytest tests/integration

      - name: Downgrade invitation schema to previous revision
        run: cd services/api && uv run alembic downgrade 20260814_0002

      - name: Upgrade invitation schema again to prove reversibility
        run: cd services/api && uv run alembic upgrade head

      - name: Downgrade full migration chain to base
        run: cd services/api && uv run alembic downgrade base

  object-storage-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVIQ_OBJECT_STORAGE_INTEGRATION: "1"
      SERVIQ_ENV: test
      SERVIQ_PUBLIC_BASE_URL: http://localhost:3000
      SERVIQ_API_BASE_URL: http://localhost:8000
      DATABASE_URL: postgresql://serviq:test@localhost:5432/serviq
      VALKEY_URL: valkey://localhost:6379/0
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      OBJECT_STORAGE_ENDPOINT: http://localhost:8333
      OBJECT_STORAGE_BUCKET: serviq-local-objects
      OBJECT_STORAGE_ACCESS_KEY: serviq-local
      OBJECT_STORAGE_SECRET_KEY: serviq-local-dev-only
      OIDC_ISSUER_URL: http://localhost:8080/realms/serviq
      OIDC_CLIENT_ID: serviq-test
      OIDC_CLIENT_SECRET: test-placeholder
      OIDC_REDIRECT_URI: http://localhost:3000/auth/callback
      SESSION_SECRET: test-placeholder
      LLM_GATEWAY_URL: http://localhost:8100
      LLM_GATEWAY_INTERNAL_TOKEN: test-placeholder
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
      LOG_LEVEL: INFO
      SERVIQ_LOCAL_WEBHOOK_ALLOWLIST: ""
      KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD: test-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.6'

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - name: Install frozen API environment
        run: cd services/api && uv sync --frozen

      - name: Start local S3-compatible storage
        run: docker compose -f infra/docker/compose.yml up -d object-storage

      - name: Wait for local S3-compatible storage
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --output /dev/null http://localhost:8333/; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f infra/docker/compose.yml logs object-storage
          exit 1

      - name: Run real object-storage integration test
        run: cd services/api && uv run pytest tests/integration/test_object_storage_integration.py

      - name: Stop local S3-compatible storage
        if: always()
        run: docker compose -f infra/docker/compose.yml down --volumes

  keycloak-oidc-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVIQ_KEYCLOAK_OIDC_INTEGRATION: "1"
      SERVIQ_ENV: test
      SERVIQ_PUBLIC_BASE_URL: http://localhost:3000
      SERVIQ_API_BASE_URL: http://localhost:8000
      DATABASE_URL: postgresql://serviq:test@localhost:5432/serviq
      VALKEY_URL: valkey://localhost:6379/0
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      OBJECT_STORAGE_ENDPOINT: http://localhost:8333
      OBJECT_STORAGE_BUCKET: serviq-test
      OBJECT_STORAGE_ACCESS_KEY: test-placeholder
      OBJECT_STORAGE_SECRET_KEY: test-placeholder
      OIDC_ISSUER_URL: http://localhost:8080/realms/serviq
      OIDC_CLIENT_ID: serviq-test
      OIDC_CLIENT_SECRET: test-placeholder
      OIDC_REDIRECT_URI: http://localhost:3000/auth/callback
      SESSION_SECRET: test-placeholder
      LLM_GATEWAY_URL: http://localhost:8100
      LLM_GATEWAY_INTERNAL_TOKEN: test-placeholder
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
      LOG_LEVEL: INFO
      SERVIQ_LOCAL_WEBHOOK_ALLOWLIST: ""
      KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD: test-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.6'

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - name: Install frozen API environment
        run: cd services/api && uv sync --frozen

      - name: Start Keycloak with deterministic test realm
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f infra/docker/compose.yml run \
            --detach \
            --name serviq-keycloak-oidc \
            --service-ports \
            --no-deps \
            --volume "${GITHUB_WORKSPACE}/infra/keycloak/serviq-test-realm.json:/opt/keycloak/data/import/serviq-realm.json:ro" \
            keycloak start-dev --import-realm

      - name: Wait for Keycloak readiness and imported realm
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              http://localhost:9000/health/ready >/dev/null \
              && curl --fail --silent --show-error \
              http://localhost:8080/realms/serviq/.well-known/openid-configuration >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          echo "Keycloak readiness timed out; safe diagnostics follow."
          docker inspect \
            --format='status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' \
            serviq-keycloak-oidc || true
          docker logs --tail 200 serviq-keycloak-oidc > /tmp/serviq-keycloak-oidc.log 2>&1 || true
          python - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          path = Path("/tmp/serviq-keycloak-oidc.log")
          text = path.read_text(encoding="utf-8", errors="replace") if path.exists() else ""
          text = re.sub(
              r"(?i)(access[_-]?token|refresh[_-]?token|id[_-]?token|client[_-]?secret|password)(\s*[=:]\s*)(\S+)",
              r"\1\2[REDACTED]",
              text,
          )
          text = re.sub(
              r"[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}",
              "[REDACTED_JWT]",
              text,
          )
          if text:
              print(text, end="" if text.endswith("\n") else "\n")
          path.unlink(missing_ok=True)
          PY
          exit 1

      - name: Run live Keycloak workforce OIDC integration tests
        run: cd services/api && uv run pytest tests/integration/test_keycloak_oidc_integration.py

      - name: Stop Keycloak test environment
        if: always()
        shell: bash
        run: |
          docker rm -f serviq-keycloak-oidc >/dev/null 2>&1 || true
          docker compose -f infra/docker/compose.yml down --volumes --remove-orphans
