name: Knowledge Quota Integration

on:
  pull_request:
    paths:
      - '.github/workflows/knowledge-quota-integration.yml'
      - 'services/api/app/core/object_storage.py'
      - 'services/api/app/core/rate_limits.py'
      - 'services/api/app/modules/knowledge/**'
      - 'services/api/alembic/versions/**'
      - 'services/api/tests/integration/test_knowledge_quota_*'
      - 'services/api/tests/integration/test_knowledge_upload_rate_limit_valkey.py'
      - 'services/api/tests/support/tenant_isolation.py'
      - 'services/api/pyproject.toml'
      - 'services/api/uv.lock'
      - 'infra/docker/compose.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/knowledge-quota-integration.yml'
      - 'services/api/app/core/object_storage.py'
      - 'services/api/app/core/rate_limits.py'
      - 'services/api/app/modules/knowledge/**'
      - 'services/api/alembic/versions/**'
      - 'services/api/tests/integration/test_knowledge_quota_*'
      - 'services/api/tests/integration/test_knowledge_upload_rate_limit_valkey.py'
      - 'services/api/tests/support/tenant_isolation.py'
      - 'services/api/pyproject.toml'
      - 'services/api/uv.lock'
      - 'infra/docker/compose.yml'

permissions:
  contents: read

jobs:
  real-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-bookworm
        env:
          POSTGRES_DB: serviq
          POSTGRES_USER: serviq
          POSTGRES_PASSWORD: serviq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U serviq -d serviq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      valkey:
        image: valkey/valkey:8.1.9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SERVIQ_DATABASE_INTEGRATION: "1"
      SERVIQ_VALKEY_INTEGRATION: "1"
      SERVIQ_OBJECT_STORAGE_INTEGRATION: "1"
      SERVIQ_KNOWLEDGE_QUOTA_REAL_STACK: "1"
      SERVIQ_ENV: test
      SERVIQ_PUBLIC_BASE_URL: http://localhost:3000
      SERVIQ_API_BASE_URL: http://localhost:8000
      DATABASE_URL: postgresql://serviq:serviq@localhost:5432/serviq
      VALKEY_URL: valkey://localhost:6379/0
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      OBJECT_STORAGE_ENDPOINT: http://localhost:8333
      OBJECT_STORAGE_BUCKET: serviq-local-objects
      OBJECT_STORAGE_ACCESS_KEY: serviq-local
      OBJECT_STORAGE_SECRET_KEY: serviq-local-dev-only
      OIDC_ISSUER_URL: http://localhost:8080/realms/serviq
      OIDC_CLIENT_ID: serviq-test
      OIDC_CLIENT_SECRET: test-placeholder
      OIDC_REDIRECT_URI: http://localhost:3000/auth/callback
      SESSION_SECRET: test-placeholder
      LLM_GATEWAY_URL: http://localhost:8100
      LLM_GATEWAY_INTERNAL_TOKEN: test-placeholder
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
      LOG_LEVEL: INFO
      SERVIQ_LOCAL_WEBHOOK_ALLOWLIST: ""
      KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD: test-placeholder
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.6'

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.9'
          enable-cache: true
          cache-dependency-glob: services/api/uv.lock

      - name: Install frozen API environment
        run: cd services/api && uv sync --frozen

      - name: Start local S3-compatible storage
        run: docker compose -f infra/docker/compose.yml up -d object-storage

      - name: Wait for local S3-compatible storage
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --output /dev/null http://localhost:8333/; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f infra/docker/compose.yml logs object-storage
          exit 1

      - name: Upgrade clean database to migration head
        run: cd services/api && uv run alembic upgrade head

      - name: Run real quota dependency evidence
        run: |
          cd services/api
          uv run pytest \
            tests/integration/test_knowledge_quota_postgres.py \
            tests/integration/test_knowledge_upload_rate_limit_valkey.py \
            tests/integration/test_knowledge_quota_real_stack.py \
            tests/integration/test_object_storage_integration.py

      - name: Stop local S3-compatible storage
        if: always()
        run: docker compose -f infra/docker/compose.yml down --volumes
