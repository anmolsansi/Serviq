name: OPE-272 documentation updater

on:
  push:
    branches:
      - ope-272-baseline-security-scanning

permissions:
  contents: write

jobs:
  update-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out ticket branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ope-272-baseline-security-scanning

      - name: Append OPE-272 implementation truth
        run: |
          python - <<'PY'
          from pathlib import Path

          guide = Path('docs/SERVIQ_BUILD_GUIDE.md')
          marker = '## OPE-272 — Baseline repository security scanning'
          text = guide.read_text()
          if marker not in text:
              text += '''\n\n## OPE-272 — Baseline repository security scanning\n\n### What we changed\n\nServiq now has a dedicated security workflow at `.github/workflows/security.yml`. Think of it as four independent security inspectors that automatically examine every pull request and every change merged to `main`. One inspector looks for risky code patterns, one looks for accidentally committed passwords or API keys, one checks the repository and infrastructure configuration for known high-severity problems, and one checks third-party software dependencies for publicly known vulnerabilities.\n\nThe four gates are intentionally separate so a new contributor can tell *what kind* of problem failed instead of seeing one vague “security failed” result. CodeQL scans both the JavaScript/TypeScript and Python code. Gitleaks checks the complete Git history and current tree for secret-like material. Trivy scans the filesystem and configuration for HIGH and CRITICAL vulnerabilities or misconfigurations. The dependency job runs `pnpm audit` for production JavaScript dependencies and `pip-audit` against the frozen API and worker Python lockfiles.\n\n### Why we did it this way\n\nServiq is designed to eventually handle customer information, organization credentials, uploaded documents, webhook data, LLM requests, and tenant-specific configuration. A security mistake becomes harder and more expensive to fix after many features depend on it. Adding automatic checks at the foundation stage means future code is examined before it reaches `main`.\n\nThe workflow does not use `continue-on-error` for required findings. In ordinary language, that means a serious finding cannot be quietly ignored while GitHub still shows a green check. Scanner setup/network failures also fail the relevant job rather than pretending the repository was scanned successfully.\n\n### Supply-chain and permission safety\n\nThe workflow pins the checkout, CodeQL, Gitleaks, Trivy, Node setup, and uv setup actions to exact commit SHAs. This prevents an upstream moving tag from silently changing the code Serviq executes in CI. The workflow is read-only by default. Only the CodeQL job receives `security-events: write`, because that job must upload analysis results to GitHub code scanning. No tenant provider key or paid security service is required.\n\nThe local `make security` command is no longer a fake failing placeholder. It runs the dependency-audit portion locally and explicitly tells the developer that CodeQL, Gitleaks, and Trivy are enforced by GitHub Actions. This keeps local setup lightweight while preserving the full repository gate in CI.\n\n### What this improves\n\nBefore OPE-272, a pull request could pass the normal lint/type/test workflow even if it accidentally contained a credential, introduced a known vulnerable dependency, or added a serious infrastructure misconfiguration. After OPE-272, those failure classes have dedicated automated checks. This does not make Serviq “secure by default” or replace human security review; it creates a repeatable baseline that future tickets can build on.\n\n### Validation and intentional limits\n\nThe ticket is considered complete only after the new Security workflow runs on the pull request and all four categories report understandable results. The implementation deliberately does not add container-image scanning because Serviq does not yet publish product container images, and it does not add penetration testing, runtime WAF/security controls, or custom Semgrep rules. Those are different layers of security and belong to later work.\n'''
              guide.write_text(text)

          context = Path('docs/repo_context.md')
          marker = '### OPE-272 security-gate reality'
          text = context.read_text()
          if marker not in text:
              text += '''\n\n### OPE-272 security-gate reality\n\n`.github/workflows/security.yml` is now the repository security gate. It runs on pull requests and pushes to `main` with separate CodeQL, Gitleaks, Trivy filesystem/configuration, and dependency-audit jobs. Scanner/setup actions are pinned to exact commits, required findings are not configured with blanket `continue-on-error`, and workflow permissions are read-only except CodeQL's job-scoped `security-events: write`.\n\n`make security` now runs the local dependency-audit subset (`pnpm audit` plus pinned `pip-audit` for the frozen API and worker lockfiles) and points contributors to the GitHub workflow for CodeQL/Gitleaks/Trivy. The LLM gateway still has no committed uv lockfile, so the Python lockfile audit intentionally covers only the API and worker until that repository landmine is resolved.\n'''
              context.write_text(text)
          PY

      - name: Commit documentation update
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/SERVIQ_BUILD_GUIDE.md docs/repo_context.md
          git commit -m "docs: explain OPE-272 security baseline"
          git push
