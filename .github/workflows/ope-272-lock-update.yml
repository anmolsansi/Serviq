name: OPE-272 lock updater

on:
  push:
    branches:
      - ope-272-baseline-security-scanning

permissions:
  contents: write

jobs:
  update-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out ticket branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ope-272-baseline-security-scanning

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc

      - name: Refresh lockfile from patched manifests
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate
          pnpm install --lockfile-only

      - name: Commit lockfile
        run: |
          if git diff --quiet pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml
          git commit -m "fix(security): refresh patched frontend dependency lock"
          git push
