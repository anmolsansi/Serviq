name: OPE-275 ruff autofix

on:
  push:
    branches:
      - ope-275-sqlalchemy-alembic

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out ticket branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ope-275-sqlalchemy-alembic
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.6'
      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
      - name: Install API
        run: cd services/api && uv sync --frozen
      - name: Apply safe Ruff fixes
        run: cd services/api && uv run ruff check . --fix --exit-zero
      - name: Commit safe lint fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/api
          git commit -m "style(database): apply Ruff-safe persistence fixes"
          git push
