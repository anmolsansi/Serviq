name: OPE-277 contract sync

on:
  push:
    branches:
      - ope-277-tenant-workforce-rbac

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out ticket branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ope-277-tenant-workforce-rbac

      - name: Record CCR-004 migration sequencing in architecture
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/ARCHITECTURE.md')
          text = path.read_text()
          needle = "The following is the frozen schema contract. Migrations may split table creation across tickets but may not rename, repurpose, or silently add cross-MAS fields without contract change control.\n"
          addition = "\n**Migration sequencing note (CCR-004):** the final `memberships.created_by_invitation_id -> organization_invitations(id) ON DELETE SET NULL` contract remains frozen, but the OPE-277 migration creates the nullable column before the invitation table exists. OPE-278 creates `organization_invitations` and then adds that foreign-key constraint in the same revision. This is a migration-order clarification only; the final schema contract below is unchanged.\n"
          if 'Migration sequencing note (CCR-004)' not in text:
              if needle not in text:
                  raise SystemExit('Frozen schema introduction not found')
              text = text.replace(needle, needle + addition, 1)
              path.write_text(text)
          PY

      - name: Commit architecture clarification
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/ARCHITECTURE.md
          git commit -m "docs(architecture): record CCR-004 migration sequencing"
          git push
