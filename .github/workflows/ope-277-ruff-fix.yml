name: OPE-277 Ruff fixer

on:
  push:
    branches:
      - ope-277-tenant-workforce-rbac

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out ticket branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ope-277-tenant-workforce-rbac

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.6'

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e

      - name: Install frozen API environment
        run: cd services/api && uv sync --frozen

      - name: Apply safe Ruff fixes
        run: cd services/api && uv run ruff check . --fix --exit-zero

      - name: Commit safe lint fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/api
          git commit -m "style(database): apply Ruff-safe RBAC migration fixes"
          git push
