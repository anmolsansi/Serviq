name: OPE-278 documentation sync

on:
  push:
    branches:
      - ope-278-organization-invitations

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out ticket branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ope-278-organization-invitations

      - name: Synchronize documented constraint name
        run: |
          python - <<'PY'
          from pathlib import Path

          old = 'fk_memberships_created_by_invitation_id_organization_invitations'
          new = 'fk_memberships_created_by_invitation_id'
          for filename in ('docs/repo_context.md', 'docs/SERVIQ_BUILD_GUIDE.md'):
              path = Path(filename)
              text = path.read_text()
              if old in text:
                  path.write_text(text.replace(old, new))
          PY

      - name: Commit documentation synchronization
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/repo_context.md docs/SERVIQ_BUILD_GUIDE.md
          git commit -m "docs(database): sync shortened invitation constraint name"
          git push
