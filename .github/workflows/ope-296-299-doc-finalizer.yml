name: OPE-296-299 docs finalizer

on:
  push:
    branches:
      - docs/ope-296-299-architecture-blocker-reconciliation
    paths:
      - .github/workflows/ope-296-299-doc-finalizer.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Append reconciliation and remove one-time helpers
        shell: bash
        run: |
          set -euo pipefail
          cat .github/ope-296-299-build-guide-append.md >> docs/SERVIQ_BUILD_GUIDE.md
          rm .github/ope-296-299-build-guide-append.md
          rm .github/workflows/ope-296-299-doc-finalizer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SERVIQ_BUILD_GUIDE.md .github
          git commit -m "docs: reconcile OPE-296 through OPE-299 architecture blockers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
