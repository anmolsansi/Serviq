name: OPE-296 build guide finalizer

on:
  push:
    branches:
      - agent/ope-296-gemini-adapter-implementation
    paths:
      - .github/ope-296-build-guide-append.md
      - .github/workflows/ope-296-build-guide-finalizer.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/ope-296-gemini-adapter-implementation
          fetch-depth: 0

      - name: Append OPE-296 implementation record
        run: cat .github/ope-296-build-guide-append.md >> docs/SERVIQ_BUILD_GUIDE.md

      - name: Remove one-time helper files
        run: |
          rm .github/ope-296-build-guide-append.md
          rm .github/workflows/ope-296-build-guide-finalizer.yml

      - name: Commit finalized documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SERVIQ_BUILD_GUIDE.md .github/ope-296-build-guide-append.md .github/workflows/ope-296-build-guide-finalizer.yml
          git commit -m "docs: finalize OPE-296 build guide"
          git push origin HEAD:agent/ope-296-gemini-adapter-implementation
