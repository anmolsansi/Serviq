name: OPE-298 build-guide finalizer

on:
  push:
    branches:
      - agent/ope-298-provider-connectivity-test-implementation
    paths:
      - .github/workflows/ope-298-build-guide-finalize.yml

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ope-298-provider-connectivity-test-implementation
          fetch-depth: 0
      - name: Append OPE-298 to cumulative guide
        run: |
          cat docs/.ope-298-build-guide-append.md >> docs/SERVIQ_BUILD_GUIDE.md
          rm docs/.ope-298-build-guide-append.md
          rm .github/workflows/ope-298-build-guide-finalize.yml
      - name: Commit permanent cumulative guide update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SERVIQ_BUILD_GUIDE.md docs/.ope-298-build-guide-append.md .github/workflows/ope-298-build-guide-finalize.yml
          git commit -m "docs(ope-298): update cumulative Serviq build guide"
          git push origin HEAD:agent/ope-298-provider-connectivity-test-implementation
