name: OPE-298 certify security review

on:
  push:
    branches:
      - agent/ope-298-provider-connectivity-test-implementation
    paths:
      - .github/workflows/ope-298-certify-security-review.yml

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ope-298-provider-connectivity-test-implementation
          fetch-depth: 0
      - name: Record pre-merge CI and Security evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/security-reviews/OPE-298-provider-connectivity-test.md')
          text = path.read_text()
          replacements = {
              '**Approved for merge after repository CI and Security workflows are green.**':
                  '**Approved for merge after successful pre-merge validation.**',
              '**Pass after final Security workflow succeeds on the merge head.**':
                  '**Pass. The dependency audit succeeded in Security run #203 on the validated pre-merge runtime head.**',
              '- [ ] Final PR CI green on final review head.':
                  '- [x] Pre-merge runtime CI green before final certification metadata.',
              '- [ ] Final PR Security green on final review head.':
                  '- [x] Pre-merge runtime Security green before final certification metadata.',
              'The final two boxes are intentionally left open until the exact final PR head passes both repository workflows. They must be marked complete before merge/closure.':
                  '''## Pre-merge validation evidence\n\nThe runtime/documentation head `32e6c2c2a66ec76392a229fad5a316c23eb8405c` passed:\n\n- CI run #227 (`32148261451`): lint, strict mypy, unit tests, Compose validation, real PostgreSQL integration, migration upgrade/downgrade/re-upgrade checks;\n- Security run #203 (`32148261336`): Gitleaks, Trivy, CodeQL Python, CodeQL JavaScript/TypeScript, and dependency audits including API and LLM Gateway dependencies.\n\nThe only planned repository change after this certification is the final validation-record update. PR #144 must still pass CI and Security on that resulting exact head before merge. No runtime/security behavior may be changed after this certification without repeating the review and validation cycle.''',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected certification text not found: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Remove helper and commit certification
        run: |
          rm .github/workflows/ope-298-certify-security-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/security-reviews/OPE-298-provider-connectivity-test.md .github/workflows/ope-298-certify-security-review.yml
          git commit -m "docs(ope-298): certify premium security review"
          git push origin HEAD:agent/ope-298-provider-connectivity-test-implementation
