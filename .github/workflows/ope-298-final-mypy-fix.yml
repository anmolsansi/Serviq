name: OPE-298 final mypy cleanup

on:
  push:
    branches:
      - agent/ope-298-provider-connectivity-test-implementation
    paths:
      - .github/workflows/ope-298-final-mypy-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ope-298-provider-connectivity-test-implementation
          fetch-depth: 0
      - name: Remove only the redundant cast reported by strict mypy
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('services/api/tests/integration/test_provider_connectivity_api.py')
          text = path.read_text()
          replacements = {
              'from typing import cast\n': '',
              'from app.modules.providers.schemas import ProviderConnectivityErrorCode\n': '',
              '                        error_code=cast(ProviderConnectivityErrorCode, code),\n':
                  '                        error_code=code,\n',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected text not found: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Remove helper and commit targeted cleanup
        run: |
          rm .github/workflows/ope-298-final-mypy-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/tests/integration/test_provider_connectivity_api.py .github/workflows/ope-298-final-mypy-fix.yml
          git commit -m "test(ope-298): remove redundant connectivity error cast"
          git push origin HEAD:agent/ope-298-provider-connectivity-test-implementation
