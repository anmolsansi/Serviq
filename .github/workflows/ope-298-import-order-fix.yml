name: OPE-298 import-order cleanup

on:
  push:
    branches:
      - agent/ope-298-provider-connectivity-test-implementation
    paths:
      - .github/workflows/ope-298-import-order-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ope-298-provider-connectivity-test-implementation
          fetch-depth: 0
      - name: Apply the exact Ruff-reported import ordering fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('services/api/tests/integration/test_provider_connectivity_api.py')
          text = path.read_text()
          old = '''from app.modules.providers.gateway import ProviderConnectivityOutcome
from app.modules.providers.schemas import ProviderConnectivityErrorCode
from app.modules.providers.router import (
    get_provider_connectivity_gateway,
    get_provider_connectivity_rate_limiter,
    get_provider_secret_store,
)
'''
          new = '''from app.modules.providers.gateway import ProviderConnectivityOutcome
from app.modules.providers.router import (
    get_provider_connectivity_gateway,
    get_provider_connectivity_rate_limiter,
    get_provider_secret_store,
)
from app.modules.providers.schemas import ProviderConnectivityErrorCode
'''
          if old not in text:
              raise SystemExit('Expected import block not found; refusing broad rewrite')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove one-time helper and commit
        run: |
          rm .github/workflows/ope-298-import-order-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/tests/integration/test_provider_connectivity_api.py .github/workflows/ope-298-import-order-fix.yml
          git commit -m "test(ope-298): satisfy Ruff import ordering"
          git push origin HEAD:agent/ope-298-provider-connectivity-test-implementation
