name: OPE-298 targeted lint cleanup

on:
  push:
    branches:
      - agent/ope-298-provider-connectivity-test-implementation
    paths:
      - .github/workflows/ope-298-lint-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ope-298-provider-connectivity-test-implementation
          fetch-depth: 0
      - name: Apply only the three CI-reported lint fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('services/api/tests/integration/test_provider_connectivity_api.py')
          text = path.read_text()
          text = text.replace('import asyncio\nimport json\nimport os\n', 'import asyncio\nimport os\n')
          text = text.replace(
              '                            "SELECT last_error_code FROM provider_connections WHERE tenant_id=:tenant"\n',
              '                            "SELECT last_error_code FROM provider_connections "\n'
              '                            "WHERE tenant_id=:tenant"\n',
          )
          text = text.replace(
              '            assert all(code is None or RAW_PROVIDER_DETAIL not in str(code) for code in stored_codes)\n',
              '            assert all(\n'
              '                code is None or RAW_PROVIDER_DETAIL not in str(code)\n'
              '                for code in stored_codes\n'
              '            )\n',
          )
          path.write_text(text)
          PY
      - name: Remove one-time helper and commit cleanup
        run: |
          rm .github/workflows/ope-298-lint-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/tests/integration/test_provider_connectivity_api.py .github/workflows/ope-298-lint-fix.yml
          git commit -m "test(ope-298): satisfy strict integration-test lint"
          git push origin HEAD:agent/ope-298-provider-connectivity-test-implementation
