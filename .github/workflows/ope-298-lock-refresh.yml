name: OPE-298 API lock refresh

on:
  push:
    branches:
      - agent/ope-298-provider-connectivity-test-implementation
    paths:
      - .github/workflows/ope-298-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ope-298-provider-connectivity-test-implementation
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Refresh frozen API dependency lock
        run: cd services/api && uv lock
      - name: Remove one-time helper and commit generated lock
        run: |
          rm .github/workflows/ope-298-lock-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/uv.lock .github/workflows/ope-298-lock-refresh.yml
          git commit -m "build(ope-298): lock Valkey client dependency"
          git push origin HEAD:agent/ope-298-provider-connectivity-test-implementation
