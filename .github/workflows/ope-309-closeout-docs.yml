name: OPE-309 Closeout Docs

on:
  push:
    branches:
      - openclawneutron/ope-309-v1304b-closeout
    paths:
      - '.github/workflows/ope-309-closeout-docs.yml'

permissions:
  contents: write

jobs:
  closeout-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out closeout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: openclawneutron/ope-309-v1304b-closeout

      - name: Update V1.3.04B closeout documentation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          repo_context = Path('docs/repo_context.md')
          text = repo_context.read_text(encoding='utf-8')
          text = text.replace(
              '> Current-state engineering map. The knowledge-upload consistency state was\n'
              '> refreshed on 2026-08-26 after V1.3.04A merged to `main` as `ae9c2d6`.\n',
              '> Current-state engineering map. Knowledge-upload quota and abuse controls were\n'
              '> refreshed on 2026-08-28 after V1.3.04B merged through PR #185 as `e846e0a`.\n',
          )
          text = text.replace(
              '| `migrations` | Alembic schema history | Ten revisions through durable knowledge-upload cleanup intents |',
              '| `migrations` | Alembic schema history | Eleven revisions through durable knowledge-upload quota reservations |',
          )
          marker = '## V1.3.04B current state — knowledge upload quota and abuse controls'
          if marker not in text:
              text += '''\n## V1.3.04B current state — knowledge upload quota and abuse controls\n\nKnowledge upload admission now has four frozen V1 controls: six multipart upload attempts per 60 seconds per trusted tenant + workforce user, three active file-upload leases per tenant, 1 GiB of committed-plus-held raw file bytes per tenant, and 100 total committed-plus-held knowledge sources per tenant. Valkey owns only the short-window user request counter and fails closed. PostgreSQL is authoritative for durable source, byte, and reservation accounting.\n\nAlembic revision `20260828_0011` adds nullable `knowledge_sources.object_size_bytes` and tenant-owned `knowledge_upload_reservations`. Quota decisions briefly lock the tenant row so concurrent API processes cannot oversubscribe source, byte, or concurrency limits. Existing file rows with unknown size are reconciled through the typed object-storage `HEAD` boundary before new file capacity is admitted. Storage I/O is never performed while the quota database transaction is open.\n\nThe V1.3.04A pre-PUT cleanup invariant remains intact. A validated file reserves capacity before the cleanup intent and raw PUT. The reservation is bound to the durable cleanup intent before PUT, released atomically when source ownership commits or confirmed cleanup succeeds, and retained against source/byte quota while cleanup remains ambiguous, pending, or exhausted. Handled failures stop consuming active concurrency immediately when possible, while crash-only concurrency over-blocking is bounded by the ten-minute lease.\n\nStable failures are `KNOWLEDGE_UPLOAD_RATE_LIMITED`, `KNOWLEDGE_UPLOAD_CONCURRENCY_LIMITED`, `KNOWLEDGE_STORAGE_QUOTA_EXCEEDED`, `KNOWLEDGE_SOURCE_QUOTA_EXCEEDED`, `KNOWLEDGE_UPLOAD_LIMITER_UNAVAILABLE`, and `KNOWLEDGE_QUOTA_UNAVAILABLE`. Rejected quota/rate requests perform no raw-object PUT and create no source row. Error and operational evidence is bounded and excludes object keys, credentials, raw filenames, file content, and foreign-tenant usage.\n\nPrimary evidence is ADR-019, CCR-007, `KNOWLEDGE_UPLOAD_QUOTA_RUNBOOK.md`, `V1.3.04B_SECURITY_RELIABILITY_REVIEW.md`, migration 0011, the quota/rate-limit modules, and real PostgreSQL, Valkey, and S3-compatible integration coverage in `.github/workflows/knowledge-quota-integration.yml`. PR #185 merged the implementation to `main` as `e846e0a259f55c3a71535a5014360d7187e4d354`; the follow-up closeout corrects the post-merge Ruff-only test formatting regression and synchronizes completion evidence.\n'''
          repo_context.write_text(text, encoding='utf-8')

          build_guide = Path('docs/SERVIQ_BUILD_GUIDE.md')
          text = build_guide.read_text(encoding='utf-8')
          marker = '## V1.3.04B — Knowledge upload quota and abuse controls'
          if marker not in text:
              text += '''\n\n---\n\n## V1.3.04B — Knowledge upload quota and abuse controls\n\nV1.3.04 and V1.3.04A made each uploaded file bounded and made failed raw-object cleanup durable. V1.3.04B adds the next protection: one tenant or one authorized-but-compromised employee cannot keep uploading forever and consume unlimited request capacity, database rows, or raw storage.\n\nThe V1 hard limits are intentionally simple. One workforce user may attempt six multipart knowledge uploads in 60 seconds. A tenant may have at most three active file uploads, at most 1 GiB of committed or still-held raw knowledge-file bytes, and at most 100 total knowledge sources across URL, sitemap, PDF, Markdown, and text. These are platform safety limits, not billing plans.\n\nThe short request-rate counter lives in Valkey because it is temporary and cheap to rebuild. Durable quota accounting lives in PostgreSQL because source rows, committed file bytes, and unresolved upload obligations must not disappear when a cache restarts. Before a new file is admitted, Serviq briefly locks that tenant's database row, calculates committed usage plus held reservations, and either creates one reservation or rejects the request. This prevents two API processes from both seeing the same remaining capacity and overshooting the limit.\n\nOlder file rows created before this ticket may not have a stored byte count. Serviq does not guess. It validates the server-generated object key and asks the S3-compatible storage layer for typed `HEAD` metadata outside the database transaction. If authoritative usage cannot be established, the new upload fails closed before PUT.\n\nThe reservation also connects directly to the V1.3.04A cleanup contract. Capacity is reserved before raw-object PUT, then bound to the durable cleanup intent. A successful source commit writes the exact validated byte count and releases the reservation. Confirmed cleanup also releases it. If cleanup is still ambiguous, pending, or exhausted, the possible raw object continues consuming byte/source quota so a leak cannot become invisible. Active concurrency is still bounded: handled failures stop occupying a slot, and a crashed request can over-block a slot for at most ten minutes.\n\nPublic failures are stable and safe: rate/concurrency limits use HTTP 429, storage quota uses 413, source quota uses 409, and unavailable authoritative limiter/accounting paths use 503. Rejected requests do not PUT a raw object or create a source row, and responses never reveal keys, credentials, raw filenames, content, or another tenant's usage.\n\nEngineering evidence includes ADR-019, CCR-007, migration `20260828_0011`, `KNOWLEDGE_UPLOAD_QUOTA_RUNBOOK.md`, `V1.3.04B_SECURITY_RELIABILITY_REVIEW.md`, unit tests, PostgreSQL race/quota tests, API rejection tests, real Valkey rate-limit tests, and real S3-compatible legacy-size reconciliation. The dedicated `Knowledge Quota Integration` workflow exercises PostgreSQL, Valkey, and object storage together.\n'''
          build_guide.write_text(text, encoding='utf-8')

          architecture = Path('docs/ARCHITECTURE.md')
          text = architecture.read_text(encoding='utf-8')
          marker = '## V1.3.04B Implemented Knowledge Upload Quota Supplement'
          if marker not in text:
              text += '''\n\n## V1.3.04B Implemented Knowledge Upload Quota Supplement\n\nThis implemented supplement is governed by ADR-019 and CCR-007 and preserves the earlier knowledge-source and V1.3.04A cleanup contracts.\n\n### Frozen hard limits\n\n| Control | V1 hard limit | Authority |\n|---|---:|---|\n| Multipart upload attempts | 6 / 60 seconds / tenant + workforce user | Valkey |\n| Active file uploads | 3 / tenant | PostgreSQL reservation lease |\n| Stored raw file bytes | 1 GiB / tenant | PostgreSQL committed bytes + held reservations |\n| Total knowledge sources | 100 / tenant | PostgreSQL committed rows + held reservations |\n| Crash-safety concurrency lease | 10 minutes | PostgreSQL |\n\n### Persistence additions\n\n`knowledge_sources.object_size_bytes bigint NULL` stores the exact validated byte count for newly committed PDF/Markdown/text sources. URL/sitemap sources remain null. Legacy file rows with unknown size are reconciled through the typed object-storage `HEAD` boundary before new file admission.\n\n`knowledge_upload_reservations` contains server-owned UUID, tenant/source identity, reserved bytes, optional cleanup identity, lease expiry, and timestamps. `(tenant_id, source_id)` and non-null cleanup identity are unique. Reservations are tenant-owned and the tenant foreign key is `ON DELETE RESTRICT`.\n\n### Admission and cleanup ordering\n\nMultipart rate limiting happens before multipart parsing and fails closed if Valkey cannot enforce the counter. Existing file validation runs before durable byte reservation. Durable source/byte/concurrency admission serializes on a short tenant-row `FOR UPDATE` lock. No object-storage call runs inside that transaction.\n\nA file reservation is created before the V1.3.04A cleanup intent/raw PUT boundary, then bound to the cleanup intent in the pre-PUT transaction. Successful source ownership writes `object_size_bytes`, marks cleanup referenced, and releases the reservation atomically. Confirmed request-time or background cleanup releases the linked reservation in the same transaction that records cleanup success. Linked prepared/pending/exhausted cleanup remains charged against byte/source quota even after concurrency lease expiry.\n\n### Stable public failures\n\n- `429 KNOWLEDGE_UPLOAD_RATE_LIMITED` with `Retry-After`;\n- `429 KNOWLEDGE_UPLOAD_CONCURRENCY_LIMITED` with bounded `Retry-After`;\n- `413 KNOWLEDGE_STORAGE_QUOTA_EXCEEDED`;\n- `409 KNOWLEDGE_SOURCE_QUOTA_EXCEEDED`;\n- `503 KNOWLEDGE_UPLOAD_LIMITER_UNAVAILABLE`;\n- `503 KNOWLEDGE_QUOTA_UNAVAILABLE`.\n\nRejected rate/quota requests perform no raw-object PUT and create no source row. Tenant/user identities come only from the existing trusted server context, and errors/logs do not expose object keys, credentials, raw filenames/content, or foreign-tenant usage.\n'''
          architecture.write_text(text, encoding='utf-8')

          review = Path('docs/V1.3.04B_SECURITY_RELIABILITY_REVIEW.md')
          review.write_text('''# V1.3.04B Security and Reliability Review\n\n## Scope\n\nCumulative review of OPE-309 / V1.3.04B after PR #185 merged the knowledge upload quota and abuse-control implementation. This review covers the merged implementation plus the closeout correction for the Ruff-only test formatting regression.\n\n## Security invariants reviewed\n\n- Trusted tenant and workforce-user IDs remain server-owned and are not accepted from multipart form fields.\n- The per-user upload limiter is tenant + workforce-user keyed and fails closed when Valkey is unavailable or returns malformed state.\n- Multipart request limiting occurs before `request.form()`, preventing rejected attempts from consuming multipart parsing or object PUT capacity.\n- Source, byte, reservation, cleanup, and legacy-size reconciliation queries are tenant-scoped.\n- Legacy object keys are parsed only through the generated `tenants/{tenant}/knowledge/{source}/raw/{object}` contract and must match trusted tenant/source identity before storage metadata I/O.\n- Quota/rate rejection performs no raw-object PUT and creates no user-visible source row.\n- Error responses contain only stable codes/messages plus bounded retry timing. They do not expose object keys, bucket credentials, raw filenames, file contents, tokens, or foreign-tenant usage.\n- The existing `knowledge.sources.manage` permission boundary remains in force.\n\n## Reliability invariants reviewed\n\n- PostgreSQL, not Valkey, is authoritative for committed source count, committed file bytes, and durable upload reservations.\n- Tenant-row locking serializes source/byte/concurrency admission across cooperating API workers and prevents quota oversubscription races.\n- No object-storage HEAD/PUT/DELETE call is performed while the quota admission database transaction is open.\n- Existing file rows with unknown size are reconciled through typed storage HEAD before new file bytes can be reserved. Unknown or contradictory usage fails closed before PUT.\n- A reservation is created before raw PUT and bound to the V1.3.04A cleanup intent before PUT is permitted.\n- Successful source persistence writes the exact validated byte count and releases the reservation atomically with cleanup transition to `referenced`.\n- Confirmed request-time/background cleanup releases the reservation atomically with cleanup transition to `succeeded`.\n- Linked `prepared`, `pending`, or `exhausted` cleanup obligations continue charging source/byte quota, so an ambiguous possible object cannot silently become free capacity.\n- Handled failures best-effort expire active concurrency immediately. Crash-only concurrency over-blocking is bounded by the ten-minute lease.\n- Expired unlinked reservations are reclaimable because V1.3.04A forbids valid raw PUT before cleanup-intent commit.\n- Migration `20260828_0011` is additive and refuses downgrade while reservation rows exist.\n\n## Test and CI evidence\n\nMerged implementation evidence includes unit coverage for the Valkey Lua decision and malformed/failure behavior, canonical raw-key parsing tests, real PostgreSQL concurrent reservation and tenant-isolation tests, API-level zero-PUT rejection tests, real Valkey limit enforcement, real S3-compatible legacy byte reconciliation, migration upgrade/downgrade coverage, and the dedicated `Knowledge Quota Integration` workflow.\n\nThe first post-merge `main` quality run failed only because `test_knowledge_quota_postgres.py` contained one unused `UUID` import and two lines over the repository's Ruff line-length limit. Database integration, object-storage integration, the dedicated real-dependencies quota job, CodeQL, Gitleaks, Trivy, and dependency auditing were otherwise green on the merge commit. The closeout branch removes that unused import and wraps those expressions without changing behavior. Final completion requires the closeout PR's CI and Security checks to be green.\n\n## Threat/failure cases explicitly considered\n\n1. Repeated authorized upload attempts: bounded by the fail-closed per-user Valkey counter.\n2. Concurrent workers racing remaining tenant capacity: serialized by tenant-row lock.\n3. Cache restart/eviction: cannot erase durable byte/source accounting because Valkey does not own it.\n4. API crash before cleanup intent: only an unlinked reservation remains and its concurrency/source/byte hold self-reclaims after the bounded lease.\n5. API crash after cleanup intent / ambiguous PUT: linked reservation remains charged until cleanup/source outcome is established.\n6. Legacy row without known bytes: storage metadata is established safely or new file admission fails closed.\n7. Cross-tenant key substitution: rejected before storage I/O by canonical key/identity validation.\n8. Operator temptation to clear exhausted reservations: runbook explicitly forbids clearing them merely to restore capacity without establishing object/source outcome.\n\n## Residual risks and out-of-scope work\n\n- These hard limits are not billing entitlements or paid-overage policy.\n- There is no customer-facing quota-management API or platform override in this ticket.\n- The worker remains an early foundation; the ticket provides durable cleanup/reconciliation contracts but does not claim a general scheduler or purge lifecycle is deployed.\n- Production deployment, full load testing, SLO/alert ownership, and broader platform rate-policy surfacing remain later roadmap work.\n\n## Review conclusion\n\nNo blocker was found in the V1.3.04B security or consistency model. The architecture preserves the V1.3.04A pre-PUT durability boundary, uses PostgreSQL for durable quota truth, limits Valkey to short-window request control, and fails closed when authoritative usage cannot be established. Completion is approved once the follow-up closeout PR proves repository quality and Security checks green and tracking is synchronized.\n''', encoding='utf-8')
          PY

      - name: Commit closeout documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'serviq-closeout-bot'
          git config user.email 'serviq-closeout-bot@users.noreply.github.com'
          git add docs/SERVIQ_BUILD_GUIDE.md docs/ARCHITECTURE.md docs/repo_context.md docs/V1.3.04B_SECURITY_RELIABILITY_REVIEW.md
          if git diff --cached --quiet; then
            echo 'No closeout documentation changes required.'
            exit 0
          fi
          git commit -m 'OPE-309 closeout: synchronize quota documentation and review evidence'
          git push origin HEAD:openclawneutron/ope-309-v1304b-closeout
