name: OPE-311 Build Guide Finalizer

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  append-build-guide:
    if: github.event.pull_request.head.ref == 'openclawneutron/ope-311-v1305-implement-ssrf-safe-public-knowledge-fetch-helper' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out OPE-311 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: openclawneutron/ope-311-v1305-implement-ssrf-safe-public-knowledge-fetch-helper

      - name: Append cumulative OPE-311 documentation once
        shell: bash
        run: |
          set -euo pipefail
          python .github/ope-311-build-guide-finalizer.py

      - name: Remove temporary finalizer and commit documentation
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/ope-311-build-guide-finalizer.yml
          git rm .github/ope-311-build-guide-finalizer.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/SERVIQ_BUILD_GUIDE.md
          git commit -m 'docs(worker): explain public fetch boundary [49/50] (#191)'
          git push origin HEAD:openclawneutron/ope-311-v1305-implement-ssrf-safe-public-knowledge-fetch-helper
