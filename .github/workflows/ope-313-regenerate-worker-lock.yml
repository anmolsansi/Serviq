name: OPE-313 Regenerate Worker Lock

on:
  push:
    branches:
      - openclawneutron/ope-313-v1307-implement-knowledge-sync-fetch-worker
    paths:
      - .github/ope-313-lock-trigger.txt

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: openclawneutron/ope-313-v1307-implement-knowledge-sync-fetch-worker

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14.6'

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e

      - name: Regenerate worker lock
        run: cd services/worker && uv lock

      - name: Commit regenerated lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- services/worker/uv.lock; then
            echo "Worker lock already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/worker/uv.lock
          git commit -m "build(worker): regenerate OPE-313 dependency lock (#198)"
          git push origin HEAD:${GITHUB_REF_NAME}
