name: OPE-314 Regenerate Worker Lock

on:
  push:
    branches:
      - openclawneutron/ope-314-v1306a-publish-transactional-outbox-events-to-kafka
    paths:
      - services/worker/pyproject.toml

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: openclawneutron/ope-314-v1306a-publish-transactional-outbox-events-to-kafka

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.6'

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Regenerate worker lock
        run: cd services/worker && uv lock

      - name: Commit regenerated lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- services/worker/uv.lock; then
            echo "Worker lock already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/worker/uv.lock
          git commit -m "build(worker): regenerate dependency lock [06/24] (#199)"
          git push origin HEAD:${GITHUB_REF_NAME}
