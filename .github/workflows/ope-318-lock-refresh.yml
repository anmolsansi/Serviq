name: OPE-318 lock refresh

on:
  push:
    branches:
      - openclawneutron/ope-318-security-upgrade-nextjssharp-to-clear-newly-published
    paths:
      - .github/ope-318-trigger

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: openclawneutron/ope-318-security-upgrade-nextjssharp-to-clear-newly-published
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          check-latest: false

      - name: Enable pinned pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Regenerate lock and verify production audit
        shell: bash
        run: |
          pnpm install --lockfile-only
          pnpm audit --audit-level high --prod

      - name: Commit lock refresh and remove temporary helper
        shell: bash
        run: |
          rm .github/ope-318-trigger
          rm .github/workflows/ope-318-lock-refresh.yml
          git config user.name "serviq-security-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add apps/client-console/package.json apps/customer-web/package.json apps/platform-console/package.json pnpm-lock.yaml .github/ope-318-trigger .github/workflows/ope-318-lock-refresh.yml
          git commit -m "fix(security): patch Next.js and sharp advisories (#216)"
          git push origin HEAD:openclawneutron/ope-318-security-upgrade-nextjssharp-to-clear-newly-published
