name: OPE-286 fixture correction

on:
  push:
    branches:
      - openclawneutron/ope-286-v1112-implement-invitation-acceptance-api

permissions:
  contents: write

jobs:
  fix-fixtures:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: openclawneutron/ope-286-v1112-implement-invitation-acceptance-api
      - name: Correct pending-invitation fixture identities
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("services/api/tests/integration/test_invitation_acceptance_api.py")
          text = path.read_text()

          old_expired = '''                await _insert_invitation(
                      session,
                      ids,
                      token=expired_token,
                      email="wrong@example.com",
                      expires_at=datetime.now(UTC) - timedelta(seconds=1),
                  )
              async with httpx.AsyncClient(transport=transport, base_url="http://test") as client:
                  expired = await client.post(ACCEPT_PATH, json={"token": expired_token})
'''
          new_expired = '''                await _insert_invitation(
                      session,
                      ids,
                      token=expired_token,
                      email="expired@example.com",
                      expires_at=datetime.now(UTC) - timedelta(seconds=1),
                  )
              _install_overrides(
                  session_factory,
                  ids["wrong_user"],
                  _identity("expired@example.com"),
              )
              async with httpx.AsyncClient(transport=transport, base_url="http://test") as client:
                  expired = await client.post(ACCEPT_PATH, json={"token": expired_token})
'''
          old_foreign = '''                await _insert_invitation(
                      session,
                      ids,
                      token=foreign_role_token,
                      email="wrong@example.com",
                      role_id=ids["role_b"],
                  )
              async with httpx.AsyncClient(transport=transport, base_url="http://test") as client:
                  corrupted = await client.post(
'''
          new_foreign = '''                await _insert_invitation(
                      session,
                      ids,
                      token=foreign_role_token,
                      email="foreign-role@example.com",
                      role_id=ids["role_b"],
                  )
              _install_overrides(
                  session_factory,
                  ids["wrong_user"],
                  _identity("foreign-role@example.com"),
              )
              async with httpx.AsyncClient(transport=transport, base_url="http://test") as client:
                  corrupted = await client.post(
'''

          if old_expired not in text:
              raise SystemExit("expired fixture block not found")
          if old_foreign not in text:
              raise SystemExit("foreign-role fixture block not found")

          text = text.replace(old_expired, new_expired, 1)
          text = text.replace(old_foreign, new_foreign, 1)
          path.write_text(text)
          PY
      - name: Commit focused fixture fix and remove helper workflow
        run: |
          rm .github/workflows/ope286-fixture-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/tests/integration/test_invitation_acceptance_api.py .github/workflows/ope286-fixture-fix.yml
          git commit -m "test(ope-286): isolate pending invitation scenarios"
          git push origin HEAD:openclawneutron/ope-286-v1112-implement-invitation-acceptance-api
