# OPE-297 follow-up — OpenRouter generation and streaming adapter

## Why this follow-up exists

The earlier OPE-296 through OPE-299 reconciliation correctly recorded OPE-297 as architecture-blocked. At that time, Serviq had not decided which OpenRouter transport/client was approved, who owned the OpenRouter endpoint, or whether a tenant could influence that endpoint.

That old status is important history, but it is no longer the current implementation state. OPE-297 has now moved through the complete sequence from blocker to architecture decision to runtime implementation and validation.

This section explains that sequence in plain language so a new engineer, product teammate, intern, or non-technical reader can understand what changed and why.

## Lifecycle from blocker to implementation

1. OPE-297 was initially investigated.
2. The ticket's explicit `Needs Architect Decision` stop condition was found.
3. A blocker record was merged instead of choosing a transport inside the feature ticket.
4. Current official OpenRouter documentation was reviewed.
5. A dedicated architecture issue and ADR were created.
6. ADR-013 froze the OpenRouter transport and endpoint rules.
7. Architecture PR #141 passed CI and Security and merged.
8. OPE-297 moved to In Progress.
9. A fresh runtime branch was created from architecture-approved `main`.
10. A separate OpenRouter adapter was implemented behind Contract C-4.
11. Mock/fake-only contract and security tests were added.
12. OpenRouter-specific embedded and mid-stream error behavior was handled explicitly.
13. The original blocker document was reconciled rather than deleted.
14. A premium security review and detailed plain-language implementation guide were added.
15. Strict CI found one dynamic-type leak in the embedded-error helper; the helper was tightened rather than weakening mypy.
16. Final merge still requires green CI and Security on the exact final PR head after this build-guide entry.

## Architecture decision: ADR-013

The architecture decision is:

`docs/architecture-decisions/ADR-013-openrouter-transport-baseline.md`

Architecture branch:

`agent/ope-297-openrouter-transport-adr`

Architecture PR:

`#141 — docs: freeze OpenRouter transport for OPE-297`

Architecture merge commit:

`592136fd02a22976ec87a685436810a89bc9b4fa`

PR #141 passed:

- CI #184;
- Security #160, including the LLM Gateway dependency vulnerability audit.

### What ADR-013 freezes

Serviq uses its existing pinned `openai==2.53.0` SDK as the OpenRouter HTTP/client transport.

The OpenRouter API destination is fixed in Serviq code as:

`https://openrouter.ai/api/v1`

The architecture also freezes these rules:

- OpenAI-compatible Chat Completions is the OPE-297 protocol surface;
- only a server-resolved tenant OpenRouter BYOK key may reach the adapter;
- only the already validated `AdapterContext.upstream_model` may be sent as the provider model;
- callers cannot supply a base URL or endpoint;
- model configuration cannot supply a base URL or endpoint;
- agent configuration cannot supply a base URL or endpoint;
- C-4 timeout and output-token budgets remain authoritative;
- SDK retries are disabled with `max_retries=0`;
- retry/fallback ownership remains above the adapter;
- JSON Schema structured output is supported through the existing C-4 field;
- streaming remains provider-neutral through `GatewayStreamEvent`;
- raw provider errors are normalized into the existing five C-4 categories;
- no provider-routing preferences, fallback arrays, plugins, web-search settings, arbitrary headers, or OpenRouter-only C-4 fields are introduced by this ticket;
- required tests remain mocks/fakes only.

## Why reuse the OpenAI SDK but not the OpenAI adapter

OpenRouter documents an OpenAI-compatible API, so the existing pinned SDK can safely provide the transport mechanics without adding another runtime dependency.

However, OpenRouter is still a different provider and therefore gets a separate adapter.

Reusing `OpenAIAdapter` directly would be wrong because:

- the normalized provider identity must be `openrouter`;
- the base URL is different;
- the credential belongs to OpenRouter;
- error messages must identify OpenRouter;
- OpenRouter can report provider failures in-band after generation has started;
- future OpenRouter-specific logic must not change OpenAI behavior.

The runtime class is therefore:

`services/llm-gateway/app/adapters/openrouter.py -> OpenRouterAdapter`

## Runtime branch and pull request

Runtime branch:

`agent/ope-297-openrouter-adapter-implementation`

Runtime PR:

`#142 — feat: implement OpenRouter C-4 adapter for OPE-297`

The branch was created only after ADR-013 merged, so runtime code starts from an architecture-approved state.

## Runtime implementation

The new adapter:

- accepts a Serviq `GatewayRequest` and `AdapterContext`;
- requires `context.provider == openrouter`;
- rejects missing or blank OpenRouter credentials before provider work;
- constructs a request-scoped `AsyncOpenAI` client with the fixed OpenRouter base URL;
- sets `max_retries=0`;
- uses the C-4 timeout;
- sends exactly `context.upstream_model`;
- preserves C-4 system/user/assistant message order;
- supports normal generation;
- supports ordered streaming;
- preserves provider-generated whitespace;
- supports native JSON Schema structured output;
- normalizes input/output token usage;
- normalizes finish reason;
- normalizes provider request ID where available;
- returns only Serviq-owned C-4 types;
- closes request-scoped client resources after success or failure.

## Fixed endpoint and SSRF/proxy protection

The OpenRouter base URL is a code-owned constant.

C-4 has no `baseUrl` or `endpoint` field and rejects unknown fields. Tests explicitly try to inject both a public attacker-controlled URL and a link-local metadata-style URL and confirm the request is rejected.

This matters because a server feature that accepts an arbitrary destination URL can become an outbound proxy or an SSRF-like primitive. OPE-297 keeps destination selection completely outside tenant control.

## Validated model ownership

The adapter does not read a raw model string from customer request JSON.

Higher-level Serviq code resolves `modelAlias` into a validated model configuration and provides the upstream provider model through `AdapterContext.upstream_model`.

The OpenRouter adapter forwards that value exactly. It does not:

- infer a model from prompt text;
- accept a second model field;
- append an OpenRouter variant;
- construct fallback lists;
- choose a cheaper provider route;
- substitute another model when an upstream call fails.

## Non-stream generation

The adapter translates C-4 messages into the OpenAI-compatible Chat Completions request, applies C-4 timeout/output-token bounds, calls the validated OpenRouter model, and then returns a Serviq `GatewayResponse`.

The normalized response includes:

- text content or structured content;
- provider `openrouter`;
- validated upstream model;
- usage counts where provided;
- finish reason;
- request ID where provided.

Raw SDK response objects do not cross the adapter boundary.

## Streaming generation

For text streaming, provider chunks are emitted in order as `GatewayStreamEvent.contentDelta`.

Whitespace is preserved exactly. Terminal metadata is normalized into C-4 finish-reason, usage, and request-ID fields.

For structured streaming, partial JSON fragments are buffered until the stream completes, parsed into a Serviq-owned dictionary, and emitted as a provider-neutral `structuredDelta`.

A stream ending without meaningful terminal metadata fails safely instead of pretending completion succeeded.

## OpenRouter-specific in-band error handling

OpenRouter can report an upstream provider failure after generation has already started. Once partial response bytes have been streamed, the outer HTTP status can no longer be changed. The failure may therefore arrive inside the completion/stream payload.

OPE-297 explicitly handles this case.

The adapter inspects only the minimum embedded fields needed to classify the failure:

- numeric code;
- stable `error_type` where present.

It discards the raw provider error message and metadata body.

Typed embedded errors map to the normal C-4 categories:

- authentication/permission -> `PROVIDER_AUTH_FAILED`;
- rate limit -> `PROVIDER_RATE_LIMITED`;
- timeout -> `PROVIDER_TIMEOUT`;
- upstream overload/unavailable/server failures -> `PROVIDER_UNAVAILABLE`;
- other request/validation errors -> `PROVIDER_INVALID_REQUEST`.

Both non-stream and mid-stream tests prove that partial generated content is not returned as a successful completed answer when OpenRouter reports an embedded provider failure.

## Standard error normalization

Normal SDK failures are also converted into the same fixed five C-4 categories:

- 401/403/authentication -> `PROVIDER_AUTH_FAILED`;
- 429 -> `PROVIDER_RATE_LIMITED`;
- timeout/408 -> `PROVIDER_TIMEOUT`;
- connection/5xx -> `PROVIDER_UNAVAILABLE`;
- applicable 4xx invalid model/schema/request -> `PROVIDER_INVALID_REQUEST`.

Public error messages are fixed Serviq-authored strings. Raw HTML/provider bodies, headers, exception strings, and credential material are not returned.

## No new provider dependency

OPE-297 introduces no new runtime package. It reuses the existing exact `openai==2.53.0` pin approved in the gateway.

Because OPE-296 already extended the Security workflow to pip-audit LLM Gateway dependencies, the shared transport dependency is explicitly included in Serviq's vulnerability gate.

A future OpenAI SDK upgrade must now regression-test both OpenAI and OpenRouter adapters.

