name: OPE-297 build guide finalizer

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/ope297-build-guide-finalizer.yml

permissions:
  contents: write

jobs:
  append-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/ope-297-openrouter-adapter-implementation
          fetch-depth: 0

      - name: Append staged build guide section and remove temporary files
        shell: bash
        run: |
          cat docs/.ope297-build-guide-section.md >> docs/SERVIQ_BUILD_GUIDE.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ope297-build-guide-finalizer.yml
          git rm docs/.ope297-build-guide-section.md
          git add docs/SERVIQ_BUILD_GUIDE.md
          git commit -m "docs: finalize OPE-297 build guide"
          git push origin HEAD:agent/ope-297-openrouter-adapter-implementation
