## What OPE-297 intentionally does not include

This ticket does not add:

- model-configuration CRUD;
- provider connectivity testing;
- automatic fallback models;
- provider preference routing;
- cheapest-model routing;
- OpenRouter plugins;
- OpenRouter web search;
- caller-controlled provider metadata;
- arbitrary HTTP headers;
- arbitrary provider base URLs;
- agent-runtime changes;
- secret-store changes;
- OpenRouter-only C-4 fields.

Those are separate product/architecture responsibilities.

## Product improvement

After validated merge, OpenRouter becomes another real implementation behind Serviq's provider-neutral C-4 boundary.

The rest of Serviq can remain unaware of:

- OpenRouter's base URL;
- OpenAI-compatible SDK mechanics;
- OpenRouter-specific embedded provider errors;
- provider SDK response classes;
- provider-specific exception classes.

This improves provider portability, endpoint safety, error consistency, testability, and future maintainability.

## OPE-297 closure gate

At the point this cumulative section is appended, the runtime implementation, tests, security review, and detailed documentation exist, but OPE-297 is not considered Done merely because documentation says so.

The final closure sequence is:

1. complete this cumulative `SERVIQ_BUILD_GUIDE.md` update;
2. create a normal repository-authored final validation commit after the one-use workflow removes itself;
3. pass CI and Security on that exact final PR head;
4. mark PR #142 ready for review;
5. merge PR #142 to `main` only while its expected head SHA still matches the validated head;
6. verify runtime code and documentation are actually present on `main`;
7. close GitHub issue #128 as completed;
8. move Linear OPE-297 to Done;
9. record the merge SHA and final validation results in Linear.

This keeps Serviq's rule consistent: only validated, merged runtime behavior completes a runtime ticket.
