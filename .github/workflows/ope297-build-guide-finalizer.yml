## Strict type-check finding and fix

During implementation validation, CI #189 passed lint but strict mypy found one issue in the embedded-error helper: a dynamic mapping lookup was inferred as `Any` while the helper promised `object | None`.

The fix did not disable or weaken mypy. Instead, the dynamic SDK metadata value was explicitly contained at the provider boundary as `object | None` before classification.

This is consistent with the design goal: provider-dynamic data should become a safe, deliberately typed internal object before it influences C-4 behavior.

The fix commit is:

`fd7f5e92bafedb824f6f8ab47cc0d69889f58a5e`

