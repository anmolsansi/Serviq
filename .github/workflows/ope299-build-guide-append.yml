The cumulative build guide is this file, so OPE-299 is explained here instead of creating another ticket-specific implementation tutorial.

## What OPE-299 deliberately does not do

This ticket does not implement:

- provider API-key creation or rotation;
- provider connectivity testing;
- provider model fallback chains;
- agent configuration schema;
- agent publishing or deployment;
- model request routing inside the LLM Gateway;
- provider SDK selection;
- alias renaming;
- purpose mutation;
- automatic migration of future agent configurations.

Those concerns stay in their own modules and tickets.

## What this improves for Serviq

Before OPE-299, the database had model rows but Serviq did not have a production-safe management API for them.

After OPE-299, Serviq gains a tenant-scoped model catalog with stable aliases, strict validation, permission checks, active-provider eligibility, non-disclosing isolation, deterministic conflicts, and real reference-aware deletion.

The larger architectural improvement is decoupling.

Future agents can depend on a Serviq-owned model identity while provider credentials remain inside the provider control plane and provider SDK details remain inside the LLM Gateway. A provider model can change without requiring every domain object to learn provider-specific naming conventions.

That is the difference between merely storing an AI model name and creating a maintainable model-configuration layer.
