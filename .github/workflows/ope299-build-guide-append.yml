# OPE-299 current status correction — implementation resumed and completed

The earlier sections in this document are an accurate historical record of why OPE-299 originally stopped. They are no longer the current implementation status.

On 2026-08-19, the missing model-reference and mutation rules were frozen in `docs/architecture-decisions/ADR-015-model-configuration-reference-and-mutation-semantics.md`. That decision introduced a tenant-safe blocking-reference registry keyed by model-configuration UUID and froze alias/purpose as immutable while provider connection, upstream model, and enabled state remain controlled mutable fields.

OPE-299 then resumed on branch `ope299` and implemented the frozen model CRUD routes, active-provider eligibility checks, tenant isolation, deterministic alias conflicts, reference-aware deletion, and real PostgreSQL integration tests.

Therefore the old statement that model configuration CRUD remains blocked should now be read only as historical context for the original stop. PR #145 is the implementation review for the resumed work.
