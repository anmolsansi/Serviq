name: OPE-300 PR build guide append

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  append-guide:
    if: github.head_ref == 'ope300' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out OPE-300 branch
        uses: actions/checkout@v4
        with:
          ref: ope300

      - name: Materialize permanent build-guide section
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          guide = Path("docs/SERVIQ_BUILD_GUIDE.md")
          push_helper = Path(".github/workflows/ope300-build-guide-append.yml")
          pr_helper = Path(".github/workflows/ope300-pr-build-guide-append.yml")
          marker = "# OPE-300 — Knowledge source, document, and chunk schema"

          text = guide.read_text()
          if marker not in text:
              helper = push_helper.read_text()
              start = "cat <<'EOF' >> docs/SERVIQ_BUILD_GUIDE.md\n"
              section = helper.split(start, 1)[1].split("\nEOF\n", 1)[0]
              guide.write_text(text.rstrip() + "\n\n" + section.rstrip() + "\n")

          push_helper.unlink(missing_ok=True)
          pr_helper.unlink(missing_ok=True)
          PY

      - name: Commit permanent build-guide update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/SERVIQ_BUILD_GUIDE.md .github/workflows/ope300-build-guide-append.yml .github/workflows/ope300-pr-build-guide-append.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: explain OPE-300 knowledge schema'
          git push origin HEAD:ope300
