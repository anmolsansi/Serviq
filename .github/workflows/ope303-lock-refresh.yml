name: OPE-303 Lock Refresh

on:
  push:
    branches: [ope303]
    paths:
      - services/api/pyproject.toml
      - .github/workflows/ope303-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ope303
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Refresh API lockfile
        working-directory: services/api
        run: uv lock
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- services/api/uv.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/api/uv.lock
          git commit -m "OPE-303 lock multipart parser dependency"
          git push origin HEAD:ope303
