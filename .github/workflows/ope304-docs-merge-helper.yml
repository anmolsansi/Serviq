name: OPE-304 Docs Merge Helper

on:
  pull_request:
    branches:
      - ope304
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  finalize-ope304-guide:
    if: github.event.pull_request.head.ref == 'ope304-task-158-docs' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out documentation task branch
        uses: actions/checkout@v4
        with:
          ref: ope304-task-158-docs
          fetch-depth: 0

      - name: Append staged OPE-304 section
        run: |
          python - <<'PY'
          from pathlib import Path

          guide_path = Path("docs/SERVIQ_BUILD_GUIDE.md")
          fragment_path = Path("docs/.ope304-release-guide-section.md")
          guide = guide_path.read_text()
          section = fragment_path.read_text().strip()
          marker = "# OPE-304 — GitHub Releases and semantic versioning"

          if marker not in guide:
              guide_path.write_text(guide.rstrip() + "\n\n---\n\n" + section + "\n")
          PY

      - name: Remove temporary documentation artifacts
        run: |
          rm -f docs/.ope304-release-guide-section.md
          rm -f .github/workflows/ope304-docs-updater.yml

      - name: Commit final cumulative guide
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- docs/SERVIQ_BUILD_GUIDE.md docs/.ope304-release-guide-section.md .github/workflows/ope304-docs-updater.yml
          if git diff --cached --quiet; then
            echo "OPE-304 documentation is already finalized."
            exit 0
          fi
          git commit -m "OPE-304 restore cumulative release guide"
          git push origin HEAD:ope304-task-158-docs
