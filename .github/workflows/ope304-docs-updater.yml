name: OPE-304 Docs Updater

on:
  push:
    branches:
      - ope304-task-158-docs

permissions:
  contents: write

jobs:
  restore-build-guide:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: ope304-task-158-docs
          fetch-depth: 0

      - name: Append OPE-304 cumulative guide section
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/SERVIQ_BUILD_GUIDE.md")
          text = path.read_text()
          marker = "# OPE-304 — GitHub Releases and semantic versioning"

          if marker in text:
              raise SystemExit("OPE-304 section already exists; refusing to append a duplicate.")

          section = r'''# OPE-304 — GitHub Releases and semantic versioning

**Implemented on integration branch:** `ope304`  
**Linear ticket:** `OPE-304`

## What problem this ticket solves

Before OPE-304, Serviq had commits, branches, pull requests, CI, and repository governance, but it did not have an official public version history. A reader could see what changed over time, but there was no permanent answer to a simple question such as:

> "Which exact commit is Serviq version 0.1.0?"

OPE-304 adds that missing release layer with Git tags, GitHub Releases, Semantic Versioning, generated release notes, release-impact metadata on pull requests, and repeatable release automation. It changes repository/release governance only. It does not change Serviq runtime APIs, database contracts, authentication, events, or customer workflows.

## Generated release notes

`.github/release.yml` tells GitHub how merged pull requests should be grouped when release notes are generated. The categories cover breaking changes, security, features, bug fixes, performance, infrastructure, testing, dependencies, documentation, refactors, and a final catch-all for changes that do not match a more specific category.

Pull requests marked `release:skip` are excluded from generated release notes. Existing default GitHub labels such as `bug`, `documentation`, and `enhancement` remain valid and are not removed.

## Semantic Versioning

Serviq release tags use a leading `v`:

```text
vMAJOR.MINOR.PATCH
```

Development releases can add a prerelease suffix:

```text
v0.1.0-alpha.1
v0.4.0-beta.1
v1.0.0-rc.1
```

The release workflow validates this format before any release command runs. Major, minor, and patch numbers cannot use leading zeroes. Numeric prerelease identifiers cannot use leading zeroes either, so `v0.2.0-alpha.1` is valid while `v0.2.0-alpha.01` is rejected. Build metadata such as `+build.7` is intentionally outside the OPE-304 release format.

## The three release paths

The permanent workflow is `.github/workflows/release.yml`.

It supports three release paths:

1. the one-time foundation prerelease bootstrap;
2. a manual release started from GitHub Actions;
3. a release triggered by an externally pushed semantic-version tag.

The manual path checks out `main`, validates the requested version, runs the repository quality gates, verifies that the tested commit is still contained in `main`, and then creates the tag and GitHub Release at that tested commit.

The tag-driven path validates the pushed tag, verifies that the tagged commit is contained in `main`, runs the same quality gates, and only then creates the GitHub Release for that existing tag.

Published tags and releases are never silently overwritten or repointed. If a requested tag or release already exists, the workflow fails rather than mutating published version history.

## Quality gates before publishing

A release is not created merely because somebody typed a version number. The workflow first runs:

```text
make setup
make lint
make typecheck
make test
docker compose -f infra/docker/compose.yml --profile "*" config --no-interpolate
```

This reuses Serviq's normal contributor and CI command surface instead of inventing a separate release-only test path.

`make security`, `make e2e`, and `make load-test` are not release gates in OPE-304 while those targets remain separate implementation concerns. They should be added to publishing only when their dedicated tickets establish the real gates.

## Release labels are bootstrapped idempotently

The release workflow ensures these labels exist:

```text
release:major
release:minor
release:patch
release:skip
breaking-change
feature
fix
security
infrastructure
testing
dependencies
refactor
performance
```

Label creation is idempotent and uses GitHub's repository-scoped `GITHUB_TOKEN`. The release paths do not require a personal access token or a paid release service.

The OPE-304 reconciliation also makes label bootstrap part of every supported release entry path. This means a manual or tag-driven release does not depend on someone remembering to recreate a missing release label first.

## Pull requests now declare release impact

`.github/pull_request_template.md` asks every contributor to state whether a change is:

```text
release:major
release:minor
release:patch
release:skip
```

The template also asks what users will notice, whether an upgrade or migration is required, and whether the change is breaking. This moves release-impact information into review time, where it is easier to verify, instead of reconstructing it later from commit history.

`CONTRIBUTING.md` documents the same Semantic Versioning and release rules, and `docs/RELEASING.md` is the permanent operator guide for creating and verifying releases.

## Why the first release is an alpha

The first public release is:

```text
v0.1.0-alpha.1
Serviq v0.1.0-alpha.1 — Platform Foundation
```

That name is deliberate. Serviq has meaningful platform-foundation work, but the complete product is not yet production-ready. The `0` major version and `alpha.1` suffix communicate that this is an early developer/platform snapshot rather than a stable customer release.

The first release was originally published from the merged release-system work and verified after publication. Reopening OPE-304 does not rewrite or repoint that historical tag. The repository policy treats published versions as immutable history. The reconciliation work strengthens the automation and restores the cumulative documentation while preserving the existing first release.

## Security and integrity rules

The release automation uses the repository-scoped `GITHUB_TOKEN` and grants write permission only where release or label operations require it. Release inputs are validated before release commands run. Releases must point to commits contained in `main`.

The workflow does not publish production credentials, customer data, or secret-bearing release assets. Repository-level immutable-release enforcement remains intentionally deferred, but Serviq already treats published tags/releases as immutable by policy. A bad published version must be corrected with a new version rather than by moving an old tag.

## What this improves

Serviq now has a durable answer to "what exact code is version X?" Clients, contributors, and future maintainers can use the Releases page as a readable version history instead of reconstructing product snapshots from dozens of commits.

Release notes remain traceable to merged pull requests, release impact is captured before merge, and every supported release path validates both repository quality and `main` ancestry before publishing.

## What OPE-304 intentionally leaves for later

OPE-304 does not:

- deploy production environments;
- publish containers to GHCR;
- generate SBOMs;
- sign artifacts;
- create provenance or attestations;
- infer major/minor/patch automatically from labels;
- introduce release branches, GitFlow, backports, or hotfix branches;
- declare Serviq stable `v1.0.0`.

Those capabilities have separate security and operational consequences and belong in dedicated reviewed tickets.

## Completion and validation rule

The reconciled OPE-304 work is complete only after the task branches are merged into `ope304`, the final `ope304` pull request passes repository CI/security checks, and the existing `v0.1.0-alpha.1` prerelease is re-verified without modifying it. GitHub #66 and Linear OPE-304 should close only after those checks are complete.
'''

          path.write_text(text.rstrip() + "\n\n---\n\n" + section.strip() + "\n")
          PY

      - name: Commit guide update and remove temporary updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/SERVIQ_BUILD_GUIDE.md
          git rm -- .github/workflows/ope304-docs-updater.yml
          git commit -m "OPE-304 restore cumulative release guide"
          git push origin HEAD:ope304-task-158-docs
