name: OPE-312 Documentation Finalizer

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - openclawneutron/ope-312-v1306-implement-source-sync-command-and-durable-outbox-event

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: openclawneutron/ope-312-v1306-implement-source-sync-command-and-durable-outbox-event
          fetch-depth: 0

      - name: Append cumulative implementation record
        shell: bash
        env:
          BUILD_GUIDE_APPEND_B64: 
          REPO_CONTEXT_APPEND_B64: 
        run: |
          set -euo pipefail
          if ! grep -Fq '## V1.3.06 — Transactional knowledge source sync and durable outbox' docs/SERVIQ_BUILD_GUIDE.md; then
            printf '%s' "$BUILD_GUIDE_APPEND_B64" | base64 --decode >> docs/SERVIQ_BUILD_GUIDE.md
          fi
          if ! grep -Fq '## V1.3.06 current state — transactional source sync and outbox' docs/repo_context.md; then
            printf '%s' "$REPO_CONTEXT_APPEND_B64" | base64 --decode >> docs/repo_context.md
          fi
          rm .github/workflows/ope312-doc-finalizer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/SERVIQ_BUILD_GUIDE.md docs/repo_context.md .github/workflows/ope312-doc-finalizer.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: finalize OPE-312 implementation record'
          git push origin HEAD:openclawneutron/ope-312-v1306-implement-source-sync-command-and-durable-outbox-event
