## V1.3.06 current state — transactional source sync and outbox

The API now implements `POST /api/v1/knowledge-sources/{sourceId}/sync`. The route reuses trusted workforce/tenant resolution and `knowledge.sources.manage`, locks the tenant-scoped source row with PostgreSQL `FOR UPDATE`, increments `sync_version`, sets `status=syncing`, clears the prior error, preserves `last_synced_at`, and inserts `serviq.knowledge.sync.v1` into the generic `outbox_events` table in the same transaction.

Alembic revision `20260902_0012` introduces the architecture-owned transactional outbox schema and its delivery/aggregate indexes. Knowledge events contain only tenant ID, source ID, and sync version. Missing/cross-tenant sources are indistinguishable 404s, disabled sources return the frozen 409, and permission failure remains 403.

Real PostgreSQL integration coverage proves URL/file happy paths, exact durable event metadata, tenant isolation, disabled/permission behavior, bounded correlation IDs, concurrent monotonic version allocation, and rollback when outbox staging fails. The publisher, broker publication, sync consumer, crawler/parser/chunker/embedder/indexer, retry execution, and completion/failure transitions remain future work.
