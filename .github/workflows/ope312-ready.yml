name: OPE-312 Mark Ready

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - openclawneutron/ope-312-v1306-implement-source-sync-command-and-durable-outbox-event

permissions:
  contents: read
  pull-requests: write

jobs:
  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Mark PR 195 ready for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 195 --repo anmolsansi/Serviq
