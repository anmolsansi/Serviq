name: Outbox Publisher Integration

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.filter.outputs.integration }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for path changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            integration:
              - 'services/worker/**'
              - 'services/api/alembic/**'
              - '.github/workflows/outbox-publisher-integration.yml'

  postgres-redpanda:
    needs: changes
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-bookworm
        env:
          POSTGRES_DB: serviq
          POSTGRES_USER: serviq
          POSTGRES_PASSWORD: serviq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U serviq -d serviq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SERVIQ_DATABASE_INTEGRATION: "1"
      SERVIQ_KAFKA_INTEGRATION: "1"
      SERVIQ_ENV: test
      SERVIQ_PUBLIC_BASE_URL: http://localhost:3000
      SERVIQ_API_BASE_URL: http://localhost:8000
      DATABASE_URL: postgresql://serviq:serviq@localhost:5432/serviq
      VALKEY_URL: valkey://localhost:6379/0
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      OBJECT_STORAGE_ENDPOINT: http://localhost:8333
      OBJECT_STORAGE_BUCKET: serviq-test
      OBJECT_STORAGE_ACCESS_KEY: test-placeholder
      OBJECT_STORAGE_SECRET_KEY: test-placeholder
      OIDC_ISSUER_URL: http://localhost:8080/realms/serviq
      OIDC_CLIENT_ID: serviq-test
      OIDC_CLIENT_SECRET: test-placeholder
      OIDC_REDIRECT_URI: http://localhost:3000/auth/callback
      SESSION_SECRET: test-placeholder
      LLM_GATEWAY_URL: http://localhost:8100
      LLM_GATEWAY_INTERNAL_TOKEN: test-placeholder
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
      LOG_LEVEL: INFO
      SERVIQ_LOCAL_WEBHOOK_ALLOWLIST: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.6'

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.9'
          enable-cache: true
          cache-dependency-glob: services/*/uv.lock

      - name: Install frozen API and worker environments
        run: |
          cd services/api && uv sync --frozen
          cd ../worker && uv sync --frozen

      - name: Upgrade database to migration head
        run: cd services/api && uv run alembic upgrade head

      - name: Start Redpanda
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name serviq-redpanda -p 9092:9092 \
            docker.redpanda.com/redpandadata/redpanda:v26.2.1 \
            redpanda start \
            --kafka-addr 0.0.0.0:9092 \
            --advertise-kafka-addr 127.0.0.1:9092 \
            --mode dev-container --smp 1
          for attempt in $(seq 1 30); do
            if docker exec serviq-redpanda rpk cluster info >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs serviq-redpanda
          exit 1

      - name: Run worker PostgreSQL and Kafka integration tests
        run: cd services/worker && uv run pytest tests/integration

      - name: Stop Redpanda
        if: always()
        run: docker rm --force serviq-redpanda || true

  outbox-publisher-gate:
    name: Outbox Publisher Integration Gate
    needs: [changes, postgres-redpanda]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate gate status
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Gate failed. Path classification did not succeed."
            exit 1
          fi

          if [ "${{ needs.changes.outputs.should_run }}" = "true" ]; then
            if [ "${{ needs.postgres-redpanda.result }}" = "success" ]; then
              echo "Gate passed. Required integration job succeeded."
              exit 0
            fi
            echo "Gate failed. Required integration job did not succeed."
            exit 1
          fi

          if [ "${{ needs.changes.outputs.should_run }}" = "false" ] && [ "${{ needs.postgres-redpanda.result }}" = "skipped" ]; then
            echo "Gate passed. Integration paths were not changed and the heavyweight job was safely skipped."
            exit 0
          fi

          echo "Gate failed. Classifier output or integration job state was unexpected."
          exit 1
