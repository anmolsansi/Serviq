name: Render Actions Node 24 Upgrade

on:
  push:
    branches:
      - openclawneutron/upgrade-actions-node24
    paths:
      - .github/node24-render-trigger.txt

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out upgrade branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: openclawneutron/upgrade-actions-node24

      - name: Render and validate permanent workflow upgrades
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          paths = [
              Path('.github/workflows/ci.yml'),
              Path('.github/workflows/knowledge-quota-integration.yml'),
              Path('.github/workflows/knowledge-sync-integration.yml'),
              Path('.github/workflows/outbox-publisher-integration.yml'),
              Path('.github/workflows/release.yml'),
              Path('.github/workflows/security.yml'),
          ]
          targets = {
              'actions/checkout': ('3d3c42e5aac5ba805825da76410c181273ba90b1', 'v7.0.1'),
              'actions/setup-node': ('820762786026740c76f36085b0efc47a31fe5020', 'v7.0.0'),
              'actions/setup-python': ('5fda3b95a4ea91299a34e894583c3862153e4b97', 'v7.0.0'),
              'pnpm/action-setup': ('0977fd99725f1db4007ccb2928dbb4e90d06cc86', 'v6.0.10'),
              'astral-sh/setup-uv': ('20cfd1bf945f4377ade1205e4dbc17946fc9a30d', 'v10.0.1'),
              'actions/upload-artifact': ('043fb46d1a93c77aae656e7c1c64a875d1fc6a0a', 'v7.0.1'),
          }
          legacy_to_current = {
              '11d5960a326750d5838078e36cf38b85af677262': targets['actions/checkout'][0],
              'd23441a48e516b6c34aea4fa41551a30e30af803': targets['actions/checkout'][0],
              '49933ea5288caeca8642d1e84afbd3f7d6820020': targets['actions/setup-node'][0],
              '249970729cb0ef3589644e2896645e5dc5ba9c38': targets['actions/setup-node'][0],
              'a26af69be951a213d495a4c3e4e4022e16d87065': targets['actions/setup-python'][0],
              'ece7cb06caefa5fff74198d8649806c4678c61a1': targets['actions/setup-python'][0],
              'b906affcce14559ad1aafd4ab0e942779e9f58b1': targets['pnpm/action-setup'][0],
              'd0cc045d04ccac9d8b7881df0226f9e82c39688e': targets['astral-sh/setup-uv'][0],
              'ea165f8d65b6e75b540449e92b4886f43607fa02': targets['actions/upload-artifact'][0],
          }
          full_sha = re.compile(r'^[0-9a-fA-F]{40}$')
          uses_line = re.compile(r'^\s*(?:-\s*)?uses:\s*(.+?)\s*$')
          uv_marker = 'uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d'
          output_dir = Path('rendered-workflows')
          output_dir.mkdir()

          for path in paths:
              original = path.read_text(encoding='utf-8')
              text = original
              for action, (sha, version) in targets.items():
                  pattern = re.compile(
                      rf'(?m)^(\s*uses:\s*){re.escape(action)}@[0-9a-fA-F]{{40}}(?:\s+#.*)?$'
                  )
                  text = pattern.sub(rf'\1{action}@{sha} # {version}', text)
              for old_sha, new_sha in legacy_to_current.items():
                  text = text.replace(old_sha, new_sha)

              lines = text.splitlines()
              rendered: list[str] = []
              index = 0
              while index < len(lines):
                  line = lines[index]
                  rendered.append(line)
                  if uv_marker in line:
                      indent = line[: len(line) - len(line.lstrip())]
                      if index + 1 < len(lines) and lines[index + 1].strip() == 'with:':
                          index += 1
                          rendered.append(lines[index])
                          if not (
                              index + 1 < len(lines)
                              and lines[index + 1].strip().startswith('version:')
                          ):
                              rendered.append(f"{indent}  version: '0.12.9'")
                      else:
                          rendered.append(f'{indent}with:')
                          rendered.append(f"{indent}  version: '0.12.9'")
                  index += 1

              text = '\n'.join(rendered) + ('\n' if original.endswith('\n') else '')
              if text == original:
                  raise SystemExit(f'{path} unexpectedly required no upgrade')
              stale = [sha for sha in legacy_to_current if sha in text]
              if stale:
                  raise SystemExit(f'{path} still contains stale SHAs: {stale}')

              check_lines = text.splitlines()
              for idx, line in enumerate(check_lines):
                  if uv_marker in line:
                      window = '\n'.join(check_lines[idx + 1 : idx + 4])
                      if "version: '0.12.9'" not in window:
                          raise SystemExit(f'{path} setup-uv is not pinned near line {idx + 1}')
                  match = uses_line.match(line)
                  if match is None:
                      continue
                  ref = match.group(1).split(' #', 1)[0].strip()
                  if ref.startswith('./') or ref.startswith('docker://'):
                      continue
                  if '@' not in ref or not full_sha.fullmatch(ref.rsplit('@', 1)[1]):
                      raise SystemExit(f'{path}:{idx + 1} mutable action reference: {ref}')

              (output_dir / path.name).write_text(text, encoding='utf-8')
              print(f'Rendered {path}')
          PY

      - name: Upload rendered workflows
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node24-rendered-workflows
          path: rendered-workflows
          if-no-files-found: error
          retention-days: 1
