name: Security

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4

  secrets:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out full repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Scan Git history and current tree for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

  filesystem:
    name: Trivy filesystem and configuration scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Scan dependencies and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy report to code scanning
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-filesystem

  dependencies:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.6'

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Audit pnpm lockfile
        shell: bash
        run: |
          set +e
          pnpm audit --audit-level high --prod --json > pnpm-audit.json
          status=$?
          set -e
          echo "PNPM_AUDIT_STATUS=$status" >> "$GITHUB_ENV"

      - name: Audit API Python lockfile
        shell: bash
        run: |
          cd services/api
          uv export --frozen --no-dev --format requirements-txt --output-file /tmp/serviq-api-requirements.txt
          set +e
          uvx --from pip-audit==2.10.1 pip-audit -r /tmp/serviq-api-requirements.txt -f json -o ../../api-pip-audit.json
          status=$?
          set -e
          echo "API_PIP_AUDIT_STATUS=$status" >> "$GITHUB_ENV"

      - name: Audit worker Python lockfile
        shell: bash
        run: |
          cd services/worker
          uv export --frozen --no-dev --format requirements-txt --output-file /tmp/serviq-worker-requirements.txt
          set +e
          uvx --from pip-audit==2.10.1 pip-audit -r /tmp/serviq-worker-requirements.txt -f json -o ../../worker-pip-audit.json
          status=$?
          set -e
          echo "WORKER_PIP_AUDIT_STATUS=$status" >> "$GITHUB_ENV"

      - name: Audit LLM Gateway Python dependencies
        shell: bash
        run: |
          cd services/llm-gateway
          uv export --no-dev --format requirements-txt --output-file /tmp/serviq-llm-gateway-requirements.txt
          set +e
          uvx --from pip-audit==2.10.1 pip-audit -r /tmp/serviq-llm-gateway-requirements.txt -f json -o ../../llm-gateway-pip-audit.json
          status=$?
          set -e
          echo "LLM_GATEWAY_PIP_AUDIT_STATUS=$status" >> "$GITHUB_ENV"

      - name: Upload dependency audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit-reports
          path: |
            pnpm-audit.json
            api-pip-audit.json
            worker-pip-audit.json
            llm-gateway-pip-audit.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce dependency audit results
        shell: bash
        run: |
          test "${PNPM_AUDIT_STATUS:-1}" -eq 0
          test "${API_PIP_AUDIT_STATUS:-1}" -eq 0
          test "${WORKER_PIP_AUDIT_STATUS:-1}" -eq 0
          test "${LLM_GATEWAY_PIP_AUDIT_STATUS:-1}" -eq 0

  ope301-doc-sync:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'ope301' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out OPE-301 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ope301

      - name: Materialize final OPE-301 documentation and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_if_present(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              text = file_path.read_text(encoding="utf-8")
              if old in text:
                  file_path.write_text(text.replace(old, new), encoding="utf-8")

          replace_if_present(
              "docs/repo_context.md",
              "The adapter exposes only put, get, delete, and exists operations. It uses explicit 5-second connect and 30-second read timeouts, one total SDK attempt, path-style S3 addressing for local compatibility, and stable Serviq-owned errors instead of leaking SDK details.",
              "The adapter exposes the OPE-301 put, get, head, and delete contract plus an `exists` convenience built on `head`. Put accepts content type and string metadata, while head returns size/content type/ETag/custom metadata without downloading the body. The adapter uses explicit 5-second connect and 30-second read timeouts, one total SDK attempt, path-style S3 addressing for local compatibility, and stable Serviq-owned errors instead of leaking SDK details.",
          )

          guide = "docs/SERVIQ_BUILD_GUIDE.md"
          replace_if_present(
              guide,
              """The adapter deliberately supports only four operations:

1. `put_object` stores bytes or a binary stream and records the supplied content type.
2. `get_object` reads an object and returns its bytes plus the small amount of metadata downstream code needs today, including content type, content length, and ETag when the backend provides one.
3. `delete_object` removes an object. Deleting an object that is already gone is treated as success, which makes cleanup code safe to repeat.
4. `exists` performs a HEAD-style check. It returns `False` when an object is missing without downloading the object body.

We intentionally did **not** add object listing, public buckets, presigned URLs, multipart-upload policy, ACL management, retention policy, lifecycle policy, or customer attachments. Those features carry additional product and security decisions and OPE-301 was not allowed to guess them.""",
              """The OPE-301 storage contract supports four primary operations:

1. `put_object` stores bytes or a binary stream, records the supplied content type, and can carry string metadata such as an original user filename without letting that metadata affect the storage key.
2. `get_object` reads an object and returns its bytes plus content type, content length, ETag when the backend provides one, and user metadata.
3. `head` asks for object metadata without downloading the body. It returns content length, content type, ETag when available, and custom metadata.
4. `delete_object` removes an object. Deleting an object that is already gone is treated as success, which makes cleanup code safe to repeat.

The adapter also provides `exists` as a convenience implemented on top of `head`. It is not a list or discovery API.

We intentionally did **not** add object listing, public buckets, presigned URLs, multipart-upload policy, ACL management, retention policy, lifecycle policy, or customer attachments. Those features carry additional product and security decisions and OPE-301 was not allowed to guess them.""",
          )
          replace_if_present(
              guide,
              "A user-facing filename can still be stored later as metadata when a dedicated upload feature is implemented. It simply cannot decide where the object lives.",
              "A user-facing filename can be carried as object metadata when the calling feature permits it. OPE-301 copies metadata at the adapter boundary, lowercases metadata keys, rejects blank keys and CR/LF/NUL control characters, and never feeds metadata values into the object-key builder. The filename can describe the object, but it cannot decide where the object lives.",
          )
          replace_if_present(
              guide,
              "A missing `get_object` becomes `OBJECT_NOT_FOUND`. A missing `exists` becomes `False`. Repeated delete remains successful. Other SDK or network failures become `OBJECT_STORAGE_UNAVAILABLE` with a generic message.",
              "A missing `get_object` or `head` becomes `OBJECT_NOT_FOUND`. `exists` converts that normalized missing-head result to `False`. Repeated delete remains successful. A `NoSuchBucket` response remains an infrastructure failure instead of being misreported as a missing object. Other SDK or network failures become `OBJECT_STORAGE_UNAVAILABLE` with a generic message.",
          )
          replace_if_present(
              guide,
              """1. make sure the test object is absent;
2. store known bytes;
3. confirm the object exists;
4. read it back and compare the content and metadata;
5. delete it;
6. confirm it no longer exists;
7. delete it again to prove cleanup is idempotent.""",
              """1. make sure the test object is absent;
2. store known bytes, content type, and an intentionally path-like original filename as metadata;
3. confirm the generated key still contains only trusted UUID identifiers;
4. confirm the object exists;
5. call `head` and verify size, content type, and custom metadata without downloading the body;
6. read the object back and compare its bytes and metadata;
7. delete it;
8. confirm it no longer exists;
9. delete it again to prove cleanup is idempotent.""",
          )
          replace_if_present(
              guide,
              "`services/api/tests/test_object_storage.py` covers exact keys, tenant separation, runtime key validation, adapter behavior, configuration, retries/timeouts, and error redaction.",
              "`services/api/tests/test_object_storage.py` covers exact keys, tenant separation, runtime key validation, put/get/head/delete/exists behavior, metadata handling, traversal/slash/backslash/Unicode-separator/4K filename isolation, missing-bucket behavior, configuration, retries/timeouts, and error redaction.",
          )

          Path(".github/ope301-doc-sync").unlink(missing_ok=True)
          Path(".github/workflows/ope301-doc-sync.yml").unlink(missing_ok=True)

          workflow = Path(".github/workflows/security.yml")
          workflow_text = workflow.read_text(encoding="utf-8")
          marker = "\n  ope301-doc-sync:\n"
          if marker not in workflow_text:
              raise SystemExit("OPE-301 documentation sync block was not found")
          workflow.write_text(workflow_text.split(marker, 1)[0].rstrip() + "\n", encoding="utf-8")
          PY

      - name: Commit final documentation state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/repo_context.md docs/SERVIQ_BUILD_GUIDE.md .github/workflows/security.yml
          git add -A .github/ope301-doc-sync .github/workflows/ope301-doc-sync.yml
          git commit -m 'docs(OPE-301): align build guide with final storage contract'
          git push origin HEAD:ope301
