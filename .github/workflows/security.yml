name: Security

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4

  secrets:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan Git history and current tree for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

  filesystem:
    name: Trivy filesystem and configuration scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan dependencies and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy report to code scanning
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-filesystem

  dependencies:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.15.0 --activate

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.6'

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.9'

      - name: Validate Python dependency locks
        run: make dependency-lock-check

      - name: Audit pnpm lockfile
        shell: bash
        env:
          npm_config_fetch_retries: '1'
          npm_config_fetch_retry_maxtimeout: '15000'
          npm_config_fetch_retry_mintimeout: '5000'
          npm_config_fetch_timeout: '30000'
        run: |
          status=1
          infra_failure=0

          for attempt in 1 2 3; do
            echo "pnpm audit attempt ${attempt}/3"
            set +e
            timeout 45s pnpm audit --audit-level high --prod --json > pnpm-audit.json
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              infra_failure=0
              break
            fi

            registry_error=0
            error_summary=""

            if [ "$status" -eq 124 ]; then
              registry_error=1
              error_summary="audit command exceeded the 45 second attempt limit"
            elif node -e 'const fs=require("fs"); try { const report=JSON.parse(fs.readFileSync("pnpm-audit.json","utf8")); process.exit(report && report.error ? 0 : 1); } catch { process.exit(1); }'; then
              registry_error=1
              error_summary="$(node -e 'const fs=require("fs"); const report=JSON.parse(fs.readFileSync("pnpm-audit.json","utf8")); const error=report.error || {}; process.stdout.write([error.code,error.message].filter(Boolean).join(": "));')"
            fi

            if [ "$registry_error" -eq 1 ]; then
              infra_failure=1
              echo "::warning::pnpm audit registry error on attempt ${attempt}/3: ${error_summary:-unknown registry error}"

              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 5))
                continue
              fi

              echo "::warning::pnpm audit remained unavailable after 3 bounded attempts. The report is retained as an artifact; this transient registry failure will not be treated as a vulnerability finding."
              status=0
              break
            fi

            infra_failure=0
            break
          done

          echo "PNPM_AUDIT_STATUS=$status" >> "$GITHUB_ENV"
          echo "PNPM_AUDIT_INFRA_STATUS=$infra_failure" >> "$GITHUB_ENV"

      - name: Audit API Python lockfile
        shell: bash
        run: |
          cd services/api
          uv export --frozen --no-dev --format requirements-txt --output-file /tmp/serviq-api-requirements.txt
          set +e
          uvx --python 3.14 --from pip-audit==2.10.1 pip-audit -r /tmp/serviq-api-requirements.txt -f json -o ../../api-pip-audit.json
          status=$?
          set -e
          echo "API_PIP_AUDIT_STATUS=$status" >> "$GITHUB_ENV"

      - name: Audit worker Python lockfile
        shell: bash
        run: |
          cd services/worker
          uv export --frozen --no-dev --format requirements-txt --output-file /tmp/serviq-worker-requirements.txt
          set +e
          uvx --python 3.14 --from pip-audit==2.10.1 pip-audit -r /tmp/serviq-worker-requirements.txt -f json -o ../../worker-pip-audit.json
          status=$?
          set -e
          echo "WORKER_PIP_AUDIT_STATUS=$status" >> "$GITHUB_ENV"

      - name: Audit LLM Gateway Python dependencies
        shell: bash
        run: |
          cd services/llm-gateway
          uv export --frozen --no-dev --format requirements-txt --output-file /tmp/serviq-llm-gateway-requirements.txt
          set +e
          uvx --python 3.14 --from pip-audit==2.10.1 pip-audit -r /tmp/serviq-llm-gateway-requirements.txt -f json -o ../../llm-gateway-pip-audit.json
          status=$?
          set -e
          echo "LLM_GATEWAY_PIP_AUDIT_STATUS=$status" >> "$GITHUB_ENV"

      - name: Upload dependency audit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit-reports
          path: |
            pnpm-audit.json
            api-pip-audit.json
            worker-pip-audit.json
            llm-gateway-pip-audit.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce dependency audit results
        shell: bash
        run: |
          if [ "${PNPM_AUDIT_INFRA_STATUS:-0}" -ne 0 ]; then
            echo "::warning::pnpm audit could not reach the registry after bounded retries; no vulnerability result was available from pnpm for this run."
          fi
          test "${PNPM_AUDIT_STATUS:-1}" -eq 0
          test "${API_PIP_AUDIT_STATUS:-1}" -eq 0
          test "${WORKER_PIP_AUDIT_STATUS:-1}" -eq 0
          test "${LLM_GATEWAY_PIP_AUDIT_STATUS:-1}" -eq 0
