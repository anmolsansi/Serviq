name: Temporary V1.3.04D Build Guide updater

on:
  push:
    branches:
      - fix/v1.0.28-sqlalchemy-asyncio-dependencies
    paths:
      - '.github/workflows/temp-update-build-guide-v1304d.yml'

permissions:
  contents: write

jobs:
  update-build-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/v1.0.28-sqlalchemy-asyncio-dependencies

      - name: Update cumulative Build Guide safely
        run: python scripts/temp_update_build_guide_v1304d.py

      - name: Commit permanent documentation and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-update-build-guide-v1304d.yml
          git rm scripts/temp_update_build_guide_v1304d.py
          git add docs/SERVIQ_BUILD_GUIDE.md
          git diff --cached --check
          git diff --cached --stat
          git commit -m "docs(knowledge): explain durable cleanup runtime [37/40] (#225)"
          git push origin HEAD:fix/v1.0.28-sqlalchemy-asyncio-dependencies
