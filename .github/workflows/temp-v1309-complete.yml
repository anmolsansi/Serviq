name: Temporary V1.3.09 Completion

on:
  push:
    branches:
      - openclawneutron/ope-316-v1309-implement-htmlhelp-center-normalization-parser

permissions:
  contents: write

jobs:
  complete-v1309:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: openclawneutron/ope-316-v1309-implement-htmlhelp-center-normalization-parser

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14.6"
          check-latest: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.9"

      - name: Apply bounded V1.3.09 changes
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path

          payload = ""
          Path('/tmp/v1309_apply.py').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          python /tmp/v1309_apply.py
          rm /tmp/v1309_apply.py
          git rm .github/workflows/temp-v1309-complete.yml

      - name: Validate V1.3.09 worker scope
        shell: bash
        run: |
          cd services/worker
          uv sync --frozen
          uv run pytest tests/test_knowledge_normalization.py
          uv run ruff check app/core/knowledge_normalization.py tests/test_knowledge_normalization.py
          uv run mypy app/core/knowledge_normalization.py tests/test_knowledge_normalization.py
          uv run pytest
          uv run ruff check .
          uv run mypy app tests

      - name: Commit validated ticket changes
        shell: bash
        run: |
          git status --short
          git add \
            services/worker/app/core/knowledge_normalization.py \
            services/worker/tests/test_knowledge_normalization.py \
            docs/architecture-decisions/ADR-025-knowledge-html-normalization-parser.md \
            docs/SERVIQ_BUILD_GUIDE.md \
            docs/repo_context.md \
            .github/workflows/temp-v1309-complete.yml
          git config user.name "anmolsansi"
          git config user.email "143311415+anmolsansi@users.noreply.github.com"
          git commit -m "feat(worker): implement V1.3.09 HTML normalization (#211)"
          git push origin HEAD:openclawneutron/ope-316-v1309-implement-htmlhelp-center-normalization-parser
