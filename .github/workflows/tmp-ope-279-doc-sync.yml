name: Temporary OPE-279 build-guide sync

on:
  push:
    branches:
      - ope-279-trusted-request-context

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Append guide and clean temporary helpers
        run: |
          python .github/scripts/tmp_append_ope279_guide.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-ope-279-doc-sync.yml
          git rm .github/scripts/tmp_append_ope279_guide.py
          if [ -f .ope279-doc-trigger ]; then git rm .ope279-doc-trigger; fi
          git add docs/SERVIQ_BUILD_GUIDE.md
          git commit -m "docs(ope-279): update cumulative build guide"
          git push origin HEAD:${GITHUB_REF_NAME}
