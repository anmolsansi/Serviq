name: Temporary OPE-280 dependency lock

on:
  push:
    branches:
      - ope-280-workforce-oidc-validation

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.6'
      - uses: astral-sh/setup-uv@v6
      - name: Regenerate frozen API lock and clean helper
        run: |
          cd services/api
          uv lock
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-ope-280-lock.yml
          git add services/api/uv.lock
          git commit -m "build(ope-280): lock JOSE runtime dependencies"
          git push origin HEAD:${GITHUB_REF_NAME}
