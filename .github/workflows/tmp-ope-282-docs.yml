name: Temporary OPE-282 documentation sync

on:
  push:
    branches:
      - ope-282-tenant-capability-resolution

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Append ticket documentation and clean helper
        run: |
          python .github/scripts/tmp_append_ope282_docs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-ope-282-docs.yml
          git rm .github/scripts/tmp_append_ope282_docs.py
          git add docs/OPE_279_285_IMPLEMENTATION_GUIDE.md docs/SERVIQ_BUILD_GUIDE.md
          git commit -m "docs(ope-282): explain tenant capability resolution"
          git push origin HEAD:${GITHUB_REF_NAME}
