name: Temporary V1.3.08 build guide reconciliation

on:
  push:
    branches:
      - openclawneutron/ope-315-v1308-implement-pdfmarkdowntext-normalization-parser
    paths:
      - .github/workflows/tmp-v1308-build-guide-update.yml

permissions:
  contents: write

jobs:
  update-build-guide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Append V1.3.07 and V1.3.08 guide sections and remove helper
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECTION_B64: ""
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git init .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD
          if ! grep -q '^## V1\.3\.07 — Knowledge sync fetch worker$' docs/SERVIQ_BUILD_GUIDE.md; then
            printf '%s' "$SECTION_B64" | base64 --decode >> docs/SERVIQ_BUILD_GUIDE.md
          fi
          rm -f .github/workflows/tmp-v1308-build-guide-update.yml
          git add docs/SERVIQ_BUILD_GUIDE.md .github/workflows/tmp-v1308-build-guide-update.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update build guide for V1.3.07 and V1.3.08"
          git push origin "HEAD:${GITHUB_REF_NAME}"
