name: Update OPE-253 Build Guide

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-guide:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Update cumulative OPE-253 completion record
        shell: python
        run: |
          from pathlib import Path

          path = Path('docs/SERVIQ_BUILD_GUIDE.md')
          text = path.read_text()

          old = '''## OPE-253 — Client Console scaffold\n\n**What changed:** the tenant/business-facing Next.js application shell was created.\n\n**Why:** internal Serviq client workflows need a dedicated application separate from customers and Serviq operators.\n\n**Status:** scaffold created; lint/typecheck/build validation still required before Done.'''

          new = '''## OPE-253 — Client Console scaffold\n\n**What changed:** the tenant/business-facing Serviq Client Console now has its own working Next.js application shell at `apps/client-console`. The app uses the App Router, React, strict TypeScript, Tailwind CSS, and app-local `dev`, `build`, `lint`, and `typecheck` commands. The visible root page intentionally remains minimal and identifies the product as **Serviq Client Console** with a **Foundation scaffold** note. PR #11 merged this scaffold into `main`.\n\n**Why:** Serviq needs a dedicated web application for the employees of a business using the platform. Those users will eventually configure AI providers, knowledge, tools, policies, conversations, human-support workflows, analytics, team access, and settings. Keeping this application separate from the public Customer Web app and the privileged Serviq Platform Console creates clearer product and security boundaries from the beginning.\n\n**How it works in plain language:** Next.js provides the web-application structure, React provides the reusable interface building blocks, strict TypeScript catches many incorrect data assumptions before the application runs, Tailwind provides the styling pipeline, and ESLint checks for common code-quality problems. At this stage the page does not call an API, use authentication, load customer data, or pretend later product features already exist. It is the tested frame that future Client Console screens will be built inside.\n\n**What this improves:** future Client Console tickets no longer need to recreate frontend setup. They can add actual product features on top of one stable application boundary. The separate app also reduces the risk of accidentally mixing business-admin code with public customer code or platform-operator code.\n\n**Validation completed:** after PR #11 was already merged, a temporary validation-only GitHub Actions PR (#14) tested the current `main` code using Node.js 24.18.0 and pnpm 10. Dependency installation succeeded. `pnpm --filter @serviq/client-console lint` passed, `pnpm --filter @serviq/client-console typecheck` passed, and `pnpm --filter @serviq/client-console build` passed. The workflow then started the Client Console development server and fetched the root page, confirming that the rendered HTML contains both `Serviq` and `Client Console` and no standard Next.js application-error marker. The temporary validation workflow was removed and PR #14 was closed without merging, so no validation-only workflow was added to `main`.\n\n**Scope intentionally not added:** OPE-253 does not add authentication, navigation, API calls, charts, real customer data, AI configuration screens, conversation screens, support-inbox logic, or a component library. Those remain separate future tickets.\n\n**Status:** **Completed.** The scaffold is merged through PR #11 and all required lint, typecheck, production-build, and root-page render checks passed. GitHub issue #4 and Linear OPE-253 can be closed as completed.'''

          if old not in text:
              raise SystemExit('Expected OPE-253 build-history block was not found; refusing to edit the guide.')

          path.write_text(text.replace(old, new, 1))

      - name: Commit guide update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/SERVIQ_BUILD_GUIDE.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs: mark OPE-253 Client Console scaffold complete'
          git push origin HEAD:${{ github.head_ref }}
