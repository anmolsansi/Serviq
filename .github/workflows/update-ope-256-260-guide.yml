name: Update OPE-256 through OPE-260 Build Guide

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

# Temporary PR-only updater. This file is removed after the cumulative guide commit is produced.
jobs:
  update-guide:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Append in-review implementation history
        shell: python
        run: |
          from pathlib import Path

          path = Path('docs/SERVIQ_BUILD_GUIDE.md')
          text = path.read_text()
          marker = '## OPE-256 — Shared UI package skeleton'
          if marker in text:
              raise SystemExit('OPE-256 through OPE-260 guide records already exist; refusing duplicate append.')

          addition = r'''

## OPE-256 — Shared UI package skeleton

**Current state:** **In Review — implemented and validated in PR #26, not yet merged into `main`.**

**What changed on the implementation branch:** `packages/ui` now exists as the proposed `@serviq/ui` shared frontend package. It contains a private ESM package manifest, strict TypeScript configuration, an intentionally empty public component export surface, a documented `tokens.css` file with neutral spacing/radius/typography/surface/status/focus placeholders, and a README that prohibits product logic and application imports.

**Why this matters:** Serviq has three separate web applications. Without one shared UI boundary, each app could create its own buttons, spacing values, status colors, and accessibility conventions. The package creates one future design-system home without pretending OPE-256 has already designed buttons, dialogs, tables, Storybook, dark mode, or final branding.

**What this improves:** later UI tickets can add reviewed shared primitives instead of copying components between applications. Semantic token names can be reused while the final visual values remain changeable by dedicated design work.

**Validation:** GitHub Actions run `31695466527` used Node.js 24.18.0 and pnpm 10.15.0. Dependency installation, `@serviq/ui` typecheck, build validation, workspace resolution, and the no-application-import check all passed. The validation run generated the root `pnpm-lock.yaml`, and the temporary validation workflow was removed afterward.

**Not implemented:** no reusable component API, feature UI, app source change, backend code, Storybook, dark mode, or final brand system.

**Tracking:** GitHub issue #20; PR #26; Linear OPE-256. The ticket should remain In Review until the implementation PR is merged and completion tracking is closed.

## OPE-257 — Shared contracts package skeleton

**Current state:** **In Review — implemented and validated in PR #27, not yet merged into `main`.**

**What changed on the implementation branch:** `packages/contracts` now exists as the proposed `@serviq/contracts` TypeScript package. It contains strict TypeScript configuration and only the generic API contract shapes already frozen by Serviq architecture: the success envelope `{ data, meta? }`, the error envelope with `code`, `message`, and optional string-map `fields`, pagination metadata using `page`, `pageSize`, `total`, and `totalPages`, and a named string correlation identifier. Empty auth/event folders reserve future ownership without inventing feature contracts. Compile-time examples exercise the frozen shapes.

**Why this matters:** frontend applications must not independently invent API shapes. Tiny differences such as `page_size` versus `pageSize`, different error-field types, or inconsistent optional metadata would make the system harder to evolve safely.

**What this improves:** shared wire vocabulary now has one reviewable location. Future feature contracts can be added through their owning architecture/API tickets rather than copied into three applications.

**Validation:** GitHub Actions run `31695492522` passed strict typecheck, build validation, workspace resolution, compile examples, and the no-application-import check on Node.js 24.18.0 / pnpm 10.15.0. The temporary workflow was removed after generating the root lockfile.

**Not implemented:** no database models, generated API client, provider SDK types, auth implementation, or feature endpoint types.

**Tracking:** GitHub issue #21; PR #27; Linear OPE-257. The ticket remains In Review until merge/completion tracking.

## OPE-258 — Cross-cutting shared package boundaries

**Current state:** **In Review — implemented and validated in PR #28, not yet merged into `main`.**

**What changed on the implementation branch:** four proposed workspace packages now have explicit ownership boundaries: `@serviq/config`, `@serviq/observability`, `@serviq/security`, and `@serviq/testkit`. Each package contains its own manifest, strict TypeScript configuration, intentionally empty public index, and README explaining what may eventually belong there and what is explicitly excluded today.

**Why this matters:** configuration, telemetry, security helpers, and test utilities are cross-cutting concerns. If they begin inside random application folders, later extraction becomes risky and duplicate behavior is likely. At the same time, implementing logging, authentication helpers, environment parsing, cryptography, or fake AI behavior before their contracts exist would be equally risky.

**What this improves:** future tickets now have four well-defined homes for reusable code while this scaffold adds no speculative runtime behavior or unnecessary dependency.

**Validation:** GitHub Actions run `31695529867` passed typechecks for all four packages, verified each workspace package name resolves, and confirmed no package imports application code on Node.js 24.18.0 / pnpm 10.15.0. The temporary workflow was removed after lockfile generation.

**Not implemented:** no OpenTelemetry/logging setup, environment parser, authentication/authorization helper, validation library, cryptographic behavior, fixtures, fake LLM, business test data, app edit, backend edit, Docker change, or persistent CI workflow.

**Tracking:** GitHub issue #22; PR #28; Linear OPE-258. The ticket remains In Review until merge/completion tracking.

## OPE-259 — FastAPI API service scaffold

**Current state:** **In Review — implemented and validated in PR #25, not yet merged into `main`.**

**What changed on the implementation branch:** `services/api` now contains the proposed Python 3.14 FastAPI service foundation. `app/main.py` exposes only a minimal `FastAPI(title="Serviq API")` application. Architecture-owned `app/core` placeholders exist for configuration, errors, logging, authentication, tenancy, idempotency, and rate limits. `app/modules` and `app/contracts` provide future ownership boundaries. Ruff, strict mypy, pytest, an import smoke test, and a resolved `uv.lock` are included.

**Dependency result:** the frozen Python 3.14 line resolved successfully. The lockfile records Python 3.14.x and includes FastAPI 0.140.13 plus compatible Pydantic 2.x, SQLAlchemy 2.x, Alembic, Uvicorn, and development tooling. This is important because the ticket explicitly forbids silently downgrading the frozen stack if it cannot resolve.

**Why this matters:** every V1 REST module needs one predictable ASGI service root and one common quality-tooling setup. Creating the framework boundary before database/auth/feature work prevents later modules from choosing incompatible layouts or hiding business logic inside framework setup.

**What this improves:** future backend tickets can implement the architecture's router → service → repository layering on a real, tested service foundation.

**Validation:** GitHub Actions run `31695430241` installed Python 3.14.6, resolved/synced the environment, passed Ruff, strict mypy, pytest, direct app import, and Uvicorn startup. The smoke test also fetched `/openapi.json` successfully. The temporary validation workflow was removed afterward.

**Not implemented:** no database connection, migration, model, auth/OIDC behavior, tenancy enforcement, idempotency store, rate-limit implementation, logging configuration, global error mapper, health endpoint, or business API endpoint.

**Tracking:** GitHub issue #23; PR #25; Linear OPE-259. The ticket remains In Review until merge/completion tracking.

## OPE-260 — Durable worker service scaffold

**Current state:** **In Review — implemented and validated in stacked PR #29, not yet merged. PR #29 currently depends on OPE-259 / PR #25.**

**What changed on the implementation branch:** `services/worker` now contains the proposed durable-worker process boundary using the same Python 3.14 quality-tooling conventions as the API scaffold but no FastAPI dependency. It includes an importable/executable `app/main.py`, explicit `app/jobs`, `app/consumers`, and `app/core` ownership boundaries, a configuration placeholder, a smoke test, and its own resolved `uv.lock`. The scaffold exits predictably because no broker or durable loop has been defined yet.

**Why this matters:** knowledge ingestion, analytics projections, webhook delivery, reconciliation, retention, notifications, and event consumers must eventually survive API-process restarts. They should not become FastAPI in-process background tasks merely because that is convenient during early development.

**What this improves:** Serviq has a separate process boundary ready for future durable work, with jobs and broker consumers kept conceptually distinct from the start.

**Validation:** GitHub Actions run `31695783384` used Python 3.14.6 and passed dependency resolution/sync, Ruff, strict mypy, pytest, direct import, process start/exit, and a source check confirming no FastAPI, `APIRouter`, or `Request` imports exist in the worker. The temporary validation workflow was removed afterward.

**Not implemented:** no Kafka/Redpanda client, real consumer, real job, database access, scheduler, retry policy, outbox publisher, external integration, or web route.

**Dependency note:** PR #29 is intentionally stacked on PR #25 so it reuses the API ticket's validated Python conventions rather than making independent framework/tooling decisions. After OPE-259 merges, OPE-260 should be retargeted or rebased onto `main` before final merge.

**Tracking:** GitHub issue #24; PR #29; Linear OPE-260. The ticket remains In Review until its dependency and merge are complete.
'''

          path.write_text(text.rstrip() + addition + '\n')

      - name: Commit cumulative guide update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/SERVIQ_BUILD_GUIDE.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs: record OPE-256 through OPE-260 implementation progress'
          git push origin HEAD:${{ github.head_ref }}
