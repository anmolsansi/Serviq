name: V1.0.26 Build Guide Update

on:
  push:
    branches:
      - v1.0.26

permissions:
  contents: write

jobs:
  restore-and-append-build-guide:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: v1.0.26
          fetch-depth: 0

      - name: Restore cumulative guide from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- docs/SERVIQ_BUILD_GUIDE.md

      - name: Append V1.0.26 implementation record
        shell: python
        run: |
          from pathlib import Path

          path = Path('docs/SERVIQ_BUILD_GUIDE.md')
          text = path.read_text()
          marker = '# V1.0.26 — Reproducible LLM gateway dependencies and Python audits'
          if marker in text:
              raise SystemExit(0)

          section = r'''

---

# V1.0.26 — Reproducible LLM gateway dependencies and Python audits

**GitHub parent issue:** #166  
**Implementation issues:** #167, #168, #169, #170  
**Integration branch:** `v1.0.26`

## What problem this work solves

Serviq already had committed `uv.lock` files for the API and worker, but the LLM gateway still resolved dependencies from its `pyproject.toml` whenever setup or a vulnerability audit ran. That made the gateway less reproducible than the other Python services because compatible transitive releases could change even when Serviq source code did not.

The audit path had a second source of machine-specific behavior. Serviq requires Python 3.14, but `uvx` creates a separate tool environment for utilities such as `pip-audit`. Without explicitly selecting Python 3.14, that tool environment could use another locally available interpreter. The repository audit that produced V1.0.26 observed exactly this class of mismatch.

V1.0.26 closes both gaps without changing provider adapters, model names, API schemas, database behavior, authentication, prompts, or customer-facing runtime behavior.

## The LLM gateway now has a committed lockfile

The new file is:

```text
services/llm-gateway/uv.lock
```

It was generated in GitHub Actions under Python 3.14.6 from the gateway's existing `pyproject.toml`, then validated with `uv lock --check` before being committed. The lock declares Python 3.14 as its required runtime line.

The gateway `pyproject.toml` was deliberately not changed. The architecture-approved provider dependency declarations remain the same. This ticket freezes the dependency graph that was already declared instead of using a reproducibility ticket to upgrade provider SDKs.

A committed lock matters because exact top-level package declarations do not automatically freeze every transitive dependency. The lock records the exact resolved graph and package hashes that setup, CI, security auditing, and release validation should consume.

## Lock freshness is checked before setup or auditing

The root `Makefile` now exposes:

```text
dependency-lock-check
```

That target runs `uv lock --check` independently for:

```text
services/api
services/worker
services/llm-gateway
```

Both `make setup` and `make security` depend on this check.

This is intentionally separate from frozen installation. `--frozen` means use the committed lock without updating it. `uv lock --check` proves that the lock still matches the dependency declaration. If someone edits a `pyproject.toml` and forgets the matching lock update, the repository now fails at the dependency boundary rather than continuing with ambiguous state.

## All normal Python dependency paths are frozen

Setup now uses `uv sync --frozen` for all three Python services, including the LLM gateway.

The Python vulnerability-audit exports also use `uv export --frozen --no-dev` for the API, worker, and gateway.

Normal setup and security commands therefore consume reviewed lock state and do not create or rewrite lockfiles as a side effect.

## `pip-audit` explicitly uses Python 3.14

Every Python dependency audit now uses the equivalent of:

```text
uvx --python 3.14 --from pip-audit==2.10.1 pip-audit ...
```

The explicit `--python 3.14` applies to the isolated tool environment created by `uvx`. This keeps the scanner on the same Python line as the Serviq services instead of allowing interpreter discovery on a contributor machine to choose a different version.

The audit tool remains pinned at `pip-audit==2.10.1`. V1.0.26 does not replace `uv`, replace `pip-audit`, or add a dependency-management service.

## Security workflow remains fail-closed

The GitHub Security dependency job now validates all Python locks before auditing them. It then exports each Python dependency set from its frozen lock and runs each audit under Python 3.14.

The existing JSON report artifacts and the final exit-status enforcement are preserved. A real dependency vulnerability therefore still produces a non-zero Security result. The ticket does not add vulnerability ignores or convert security failures into warnings merely to make automation green.

## CI proves setup leaves the checkout clean

The main CI quality job runs `make setup` and immediately checks `git status --porcelain`.

If dependency installation creates or modifies a repository file, CI prints the dirty status and fails before continuing to lint, type checking, and tests. This catches regressions such as removing `--frozen`, forgetting to commit a lock, or introducing a setup command that rewrites tracked dependency state.

The check is intentionally placed immediately after dependency setup so any failure is attributable to installation rather than later build/test output.

## Release paths enforce the same dependency rule

The foundation, manual, and tag-driven release paths already use the repository's shared `make setup` command. V1.0.26 keeps that command surface and adds the same immediate clean-worktree verification after dependency installation in each release path.

A release therefore cannot continue to lint, test, tag, or publish if preparing dependencies changed the checked-out source tree.

No release versioning semantics changed. This work does not move or rewrite published tags, does not republish the existing `v0.1.0-alpha.1`, does not broaden release token permissions, and does not declare Serviq production-ready.

## Contributor workflow

`CONTRIBUTING.md` now states that all three Python services require Python 3.14.x and own committed locks. Contributors can run `make dependency-lock-check` to verify lock freshness without installing dependencies.

Intentional dependency work must update the owning `pyproject.toml`, regenerate the corresponding `uv.lock` under Python 3.14, review both together, and commit them together. Hand-editing a lock merely to satisfy CI is not an accepted workflow.

## What this improves

### Reproducible development

A clean checkout has one reviewed Python dependency graph for each service. Gateway installation no longer depends on whichever compatible transitive release happens to be newest at the time of setup.

### Reproducible security evidence

The scanner receives dependency exports produced from committed locks and runs under the same Python major/minor line as the application services.

### Safer releases

Release dependency preparation must leave the repository unchanged. A release cannot unknowingly proceed from dependency commands that generated or rewrote tracked state.

### Easier debugging

A stale lock fails at the lock-check step. A dirty dependency setup fails immediately after setup. These failure locations are much easier to diagnose than discovering dependency drift later in provider tests or release publication.

## Validation evidence

The LLM gateway lock was generated by a GitHub Actions job using Python 3.14.6. That job successfully completed both lock generation and `uv lock --check` before committing the file.

The final branch is validated by Serviq's normal CI and Security workflows. CI covers frozen setup, the clean-worktree gate, lint, type checking, tests, Compose configuration, and the existing integration jobs. Security covers CodeQL, Gitleaks, Trivy, lock validation, frozen dependency exports, explicit Python 3.14 `pip-audit`, audit artifacts, and non-zero audit enforcement.

The ticket's stale-lock negative case is tested on temporary copied dependency metadata so the real branch does not need to be intentionally dirtied. Changing the copied gateway `pyproject.toml` without changing its copied lock must make `uv lock --check` fail.

`make e2e` and `make load-test` remain intentional non-zero placeholders and are not claimed as passing evidence for this dependency ticket.

## What did not change

V1.0.26 does not change:

- provider adapter contracts;
- OpenAI, Anthropic, Gemini, or OpenRouter behavior;
- model names or aliases;
- API request or response schemas;
- database tables or migrations;
- authentication or authorization;
- tenant ownership boundaries;
- prompts or tool payloads;
- customer-facing UI behavior.

This is a developer, CI, security, and release-reliability change only.

## Existing repository-context discrepancy

During V1.0.26 we confirmed that `services/api/uv.lock` and `services/worker/uv.lock` already exist even though one sentence in `docs/repo_context.md` still says there is no committed Python lockfile.

That sentence is stale documentation. `docs/repo_context.md` is outside the approved V1.0.26 file list, so this ticket records the discrepancy rather than widening scope. The actual committed lockfiles and executable dependency commands are treated as the implementation evidence.

## Completion rule

V1.0.26 is complete only when the final `v1.0.26` head contains the gateway lock, frozen setup/export commands, explicit Python 3.14 audit selection, CI/Security/Release enforcement, contributor documentation, and this cumulative explanation, and that exact head passes the required CI and Security workflows before merge.

The GitHub task issues and parent issue close only after the merged `main` result and post-merge workflows are verified.
'''
          path.write_text(text.rstrip() + section + '\n')

      - name: Commit restored cumulative guide
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SERVIQ_BUILD_GUIDE.md
          if git diff --cached --quiet; then
            echo "Build guide already matches the intended result."
            exit 0
          fi
          git commit -m "V1.0.26.4: document reproducible dependency workflow"
          git push origin HEAD:v1.0.26
