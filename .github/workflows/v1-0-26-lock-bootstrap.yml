name: V1.0.26 Lock Bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-llm-gateway-lock:
    if: github.head_ref == 'v1.0.26'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: v1.0.26

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.6'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Generate LLM gateway lock
        run: cd services/llm-gateway && uv lock --python 3.14

      - name: Validate generated lock
        run: cd services/llm-gateway && uv lock --check

      - name: Commit generated lock when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- services/llm-gateway/uv.lock && git ls-files --error-unmatch services/llm-gateway/uv.lock >/dev/null 2>&1; then
            echo "Gateway lock is already committed and current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/llm-gateway/uv.lock
          git commit -m "V1.0.26.1: lock LLM gateway dependencies"
          git push origin HEAD:v1.0.26
