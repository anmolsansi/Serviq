name: V1.0.27 guide cleanup

on:
  push:
    branches:
      - v1.0.27
    paths:
      - docs/SERVIQ_BUILD_GUIDE.md
      - .github/workflows/v1.0.27-doc-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out task branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: v1.0.27

      - name: Remove duplicated historical sentence and helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/SERVIQ_BUILD_GUIDE.md")
          text = path.read_text(encoding="utf-8")
          sentence = (
              "That separation is one of the main differences between a demo chatbot "
              "and a production system."
          )
          duplicate = f"{sentence}\n\n{sentence}\n"
          if text.count(duplicate) != 1:
              raise SystemExit("Expected exactly one duplicated historical sentence block.")
          path.write_text(text.replace(duplicate, f"{sentence}\n", 1), encoding="utf-8")
          PY
          rm .github/workflows/v1.0.27-doc-cleanup.yml

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/SERVIQ_BUILD_GUIDE.md .github/workflows/v1.0.27-doc-cleanup.yml
          git commit -m "docs(v1.0.27): remove unrelated guide duplication [40/46] (#173)"
          git push origin HEAD:v1.0.27
