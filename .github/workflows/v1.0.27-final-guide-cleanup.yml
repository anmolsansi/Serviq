name: V1.0.27 final guide cleanup

on:
  pull_request:
    branches:
      - main
    paths:
      - docs/SERVIQ_BUILD_GUIDE.md
      - .github/workflows/v1.0.27-final-guide-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out task branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: v1.0.27

      - name: Restore historical guide prefix and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/SERVIQ_BUILD_GUIDE.md")
          text = path.read_text(encoding="utf-8")
          paragraph = (
              "It is being designed more like a digital support employee that can read company "
              "instructions, check company systems, follow rules, take approved actions, and know "
              "when a human must take over."
          )
          extra = (
              "That separation is one of the main differences between a demo chatbot and a "
              "production system."
          )
          target = f"{paragraph}\n\n{extra}\n\n---"
          replacement = f"{paragraph}\n\n---"
          count = text.count(target)
          if count > 1:
              raise SystemExit("Found more than one unexpected historical guide prefix.")
          if count == 1:
              path.write_text(text.replace(target, replacement, 1), encoding="utf-8")
          PY
          rm -f .github/workflows/v1.0.27-final-guide-cleanup.yml

      - name: Commit cleanup when needed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Cleanup already applied."
            exit 0
          fi
          git commit -m "docs(v1.0.27): restore append-only guide diff [40/46] (#173)"
          git push origin HEAD:v1.0.27
