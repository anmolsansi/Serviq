    branches:
      - v1.3.04a-completion

permissions:
  contents: write

jobs:
  finalize-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: v1.3.04a-completion
          fetch-depth: 0

      - name: Complete V1.3.04A cumulative documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          build_guide = Path('docs/SERVIQ_BUILD_GUIDE.md')
          architecture = Path('docs/ARCHITECTURE.md')
          repo_context = Path('docs/repo_context.md')

          build_marker = '## V1.3.04A — Durable knowledge-upload consistency'
          build_section = r'''

---

## V1.3.04A — Durable knowledge-upload consistency

V1.3.04A closes a cross-system failure gap in file-backed knowledge uploads. The ticket is tracked by GitHub issue #178 and Linear OPE-308, and the implementation was merged through PR #180.

### The problem this ticket solves

A raw knowledge upload crosses two durable systems: S3-compatible object storage holds the file bytes, while PostgreSQL holds the `knowledge_sources` record that makes the upload part of Serviq's product state. Those two systems cannot participate in one ordinary PostgreSQL transaction.

Before V1.3.04A, Serviq could successfully upload an object and then fail while committing the source row. The request attempted a compensating object delete, but if that delete also failed there was no durable database record describing the orphaned object. The file could therefore exist without either a durable source reference or durable cleanup work.

The ticket's invariant is now:

> Before Serviq attempts a raw-object PUT, PostgreSQL already contains enough tenant-scoped information to reconcile that exact generated object later.

That means every attempted raw upload is either referenced by normal product state or represented by durable cleanup state until it is resolved or explicitly exhausted for operator action.

### Architecture selected

ADR-018 and CCR-006 freeze a pre-upload PostgreSQL cleanup-intent design. Serviq does not create a tenant-visible failed knowledge source before storage succeeds, does not depend on bucket-wide object listing, and does not introduce a new broker/outbox dependency before the planned asynchronous platform work.

The additive internal table is `knowledge_upload_cleanups`. It records:

- a cleanup ID;
- tenant ID;
- the intended source ID and object ID;
- the exact server-generated raw object key;
- cleanup status;
- bounded attempt count;
- the next retry time;
- a safe bounded error code;
- resolution and audit timestamps.

The states are `prepared`, `pending`, `referenced`, `succeeded`, and `exhausted`.

`prepared` means PostgreSQL knows the upload identity before the PUT. `pending` means cleanup/reconciliation work remains. `referenced` means the normal knowledge source and cleanup reference transition committed together. `succeeded` means cleanup completed. `exhausted` is the bounded DLQ-equivalent state requiring operator recovery instead of silent infinite retries.

### Successful upload flow

For a valid authorized file upload, Serviq now performs these steps:

1. enforce the existing `knowledge.sources.manage` permission;
2. validate the existing file type/size contract;
3. generate the source ID, object ID, cleanup ID, and typed raw-object key server-side;
4. commit a `prepared` cleanup intent in PostgreSQL before object-storage I/O;
5. perform the object PUT outside any database transaction;
6. after confirmed PUT success, open a PostgreSQL transaction;
7. row-lock the cleanup intent, create the normal `knowledge_sources` row, and change the cleanup state to `referenced` in that same transaction;
8. return the existing successful upload response.

The public request/response envelope, generated raw-key layout, supported upload types and size limits, and tenant-visible source-list behavior do not change.

### What happens when PostgreSQL fails after the PUT

If object storage confirms the PUT but the source transaction fails, the source transaction rolls back while the pre-existing cleanup row remains durable.

Serviq then performs fast best-effort recovery outside the database transaction:

- arm the cleanup for background reconciliation;
- attempt one immediate idempotent delete;
- if the delete succeeds, record cleanup success when possible;
- if delete or the follow-up state write also fails, leave the already-durable cleanup row available to reconciliation.

The original failed request is never converted into success merely because cleanup work was scheduled.

### The double-failure case

The important adversarial case is:

```text
object PUT succeeds
        +
source-row PostgreSQL transaction fails
        +
compensating DELETE fails
```

V1.3.04A keeps a `prepared` or `pending` cleanup obligation in PostgreSQL for the exact tenant/source/object identity. Therefore the raw object is not undiscoverable even though both request-time recovery operations failed.

### Ambiguous object-storage PUT failures

An object-storage client error does not always prove the remote PUT failed. A network timeout can occur after the server accepted the object.

V1.3.04A therefore treats a generic PUT storage error conservatively. The cleanup intent remains `prepared` with a 15-minute stale deadline. The request may still attempt an immediate delete as an optimization, but that delete alone does not prove the ambiguous PUT can never become visible later.

When the stale intent becomes due, reconciliation first performs the existing typed `exists`/HEAD check. If the object is visible, it performs the idempotent delete. If the object is absent or the presence check itself fails, Serviq preserves bounded ambiguous-outcome handling rather than silently declaring success.

The 15-minute grace is intentionally much longer than the object-storage adapter's bounded request timeouts, reducing the risk of racing a still-unresolved request outcome.

### Bounded retry contract

The request-time immediate delete does not consume the background retry budget.

For confirmed source-persistence failure, the first replay is due after 30 seconds. Background failure timing is then:

- attempt 1 failure -> retry in 5 minutes;
- attempt 2 failure -> retry in 30 minutes;
- attempt 3 failure -> `exhausted`.

A stale ambiguous `prepared` intent uses the same bounded three-attempt reconciliation budget after its grace period.

The row is claimed in a short row-locked PostgreSQL transaction. Object-storage HEAD/DELETE calls happen only after that transaction ends. This prevents slow storage I/O from holding database locks while still giving concurrent workers a durable lease-like claim.

### Tenant and key safety

Cleanup replay is always scoped by both tenant ID and cleanup ID. A foreign tenant cannot use a cleanup identifier to make Serviq touch another tenant's object.

The replay path regenerates the typed raw key from the stored tenant/source/object identity and compares it with the persisted key. A mismatch fails closed into an exhausted key-mismatch condition rather than deleting an unexpected object.

No new tenant-facing cleanup endpoint was added.

### Logging and operator visibility

Structured cleanup logs contain bounded operational fields such as cleanup ID, tenant ID, status, attempt count, and safe error code. They intentionally omit object keys, uploaded content, credentials, tokens, and secrets.

The repository also exposes an internal status-count query contract so later platform/observability work can report counts of `prepared`, `pending`, `referenced`, `succeeded`, and `exhausted` work without exposing keys or document data. V1.3.04A does not add a new metrics SDK solely for this ticket.

### Retention and operator recovery

Unresolved `prepared` and `pending` rows remain until reconciliation resolves them. `exhausted` rows remain available for operator investigation/recovery. Resolved `referenced` and `succeeded` rows are eligible for a later retention/purge mechanism after 14 days; V1.3.04A intentionally does not add that purge job.

The operator procedure and failure-state interpretation are documented in `docs/KNOWLEDGE_UPLOAD_CONSISTENCY_RUNBOOK.md`.

### Database migration and rollback safety

Alembic revision `20260824_0010_knowledge_upload_cleanups.py` adds the cleanup table, constraints, uniqueness rules, and tenant/status/due-time indexes without changing the existing public source schema.

Downgrade is guarded: the migration refuses to drop the cleanup table while unresolved `prepared`, `pending`, or `exhausted` obligations remain. This prevents rollback from deleting the only durable evidence needed to reconcile an uploaded raw object.

### Validation evidence

The merged implementation includes integration coverage for:

- happy-path upload plus durable `referenced` state;
- cleanup-intent database failure proving storage PUT is not called;
- confirmed source persistence failure plus successful delete;
- source persistence failure plus delete failure leaving durable work;
- an additional failure while arming retry, proving the original pre-upload intent remains;
- ambiguous PUT handling;
- due reconciliation and idempotent repeated replay;
- foreign-tenant replay denial before storage access;
- 30-second / 5-minute / 30-minute scheduling and three-attempt exhaustion;
- operator status counts;
- safe logs that do not disclose the raw object key;
- real PostgreSQL migration/schema integration;
- S3-compatible object-storage integration.

The exact implementation head `22ad508fc148f68759b4b0466323e9ce6e452c1c` passed both the repository CI and Security workflows before merge. PR #180 merged that head into `main` as merge commit `ae9c2d67b8e09b3db62e824b7868fa3e163324b0` on 2026-08-26.

### Main files introduced or changed

```text
docs/KNOWLEDGE_UPLOAD_CONSISTENCY_RUNBOOK.md
docs/V1.3.04A_SECURITY_RELIABILITY_REVIEW.md
docs/architecture-decisions/ADR-017-knowledge-upload-multipart-boundary.md
docs/architecture-decisions/ADR-018-durable-knowledge-upload-consistency.md
docs/contract-changes/CCR-006-durable-knowledge-upload-cleanup-intent.md
services/api/alembic/versions/20260824_0010_knowledge_upload_cleanups.py
services/api/app/modules/knowledge/cleanup.py
services/api/app/modules/knowledge/models.py
services/api/app/modules/knowledge/repository.py
services/api/app/modules/knowledge/service.py
services/api/tests/integration/test_database_integration.py
services/api/tests/integration/test_knowledge_file_upload_api.py
services/api/tests/integration/test_knowledge_upload_cleanup.py
```

### What V1.3.04A intentionally does not add

This ticket does not implement knowledge parsing/indexing, customer attachments, bucket lifecycle policies, a new storage service, a general transactional outbox, new broker topics/consumers, a cleanup UI, or changes to the generated object-key layout/file rules. Those remain separate roadmap concerns.
'''

          text = build_guide.read_text()
          if build_marker not in text:
              build_guide.write_text(text.rstrip() + build_section + '\n')

          arch_text = architecture.read_text()
          cleanup_schema = r'''knowledge_upload_cleanups
  id uuid PK DEFAULT uuidv7()
  tenant_id uuid NOT NULL FK tenants RESTRICT
  source_id uuid NOT NULL
  object_id uuid NOT NULL
  object_key text NOT NULL
  status text NOT NULL CHECK prepared|pending|referenced|succeeded|exhausted
  attempt_count integer NOT NULL DEFAULT 0 CHECK 0..3
  next_attempt_at timestamptz NULL
  last_error_code text NULL
  resolved_at timestamptz NULL
  created_at timestamptz NOT NULL DEFAULT now()
  updated_at timestamptz NOT NULL DEFAULT now()
Constraints: UNIQUE(tenant_id, source_id), UNIQUE(object_key); unresolved states require next_attempt_at and no resolved_at; terminal states require resolved_at and no next_attempt_at
Indexes: (tenant_id, status, next_attempt_at), (status, next_attempt_at)

'''
          if 'knowledge_upload_cleanups\n' not in arch_text:
              needle = 'knowledge_documents\n  id uuid PK\n'
              if needle not in arch_text:
                  raise SystemExit('Architecture knowledge_documents insertion point not found')
              arch_text = arch_text.replace(needle, cleanup_schema + needle, 1)

          arch_marker = '## V1.3.04A durable knowledge-upload consistency contract'
          arch_section = r'''

## V1.3.04A durable knowledge-upload consistency contract

ADR-018 and CCR-006 freeze the cross-store raw-upload boundary. Before any raw object PUT, the API commits a tenant-scoped `knowledge_upload_cleanups` row containing the generated source/object identity and typed raw key. A successful PUT is followed by one PostgreSQL transaction that creates the normal `knowledge_sources` row and changes the cleanup state to `referenced` atomically.

Storage I/O is never performed while the cleanup/source PostgreSQL transaction is open. Confirmed source-persistence failure keeps the durable intent, schedules the first replay after 30 seconds, and may perform one immediate idempotent delete as a fast path. Background delete failures retry after 5 minutes and 30 minutes; the third failed replay becomes `exhausted`.

A generic object-storage PUT error is treated as outcome-ambiguous. Its `prepared` intent remains durable for a 15-minute grace period and later reconciliation uses the existing typed `exists`/HEAD operation before deciding whether deletion is required. Absence after an ambiguous PUT is not used to erase the obligation immediately; the same bounded observation/retry budget applies.

Replay is tenant-scoped and regenerates the expected typed key from tenant/source/object identity. A key mismatch fails closed. Structured state logs and internal status counts omit object keys, file contents, credentials, and tokens. No public cleanup API is added.

Resolved `referenced`/`succeeded` rows are eligible for a future purge after 14 days; unresolved and `exhausted` work is retained for reconciliation/operator recovery. Alembic downgrade refuses to drop the table while unresolved `prepared`, `pending`, or `exhausted` obligations exist.

This contract preserves the existing knowledge-upload HTTP envelope, supported types/size limits, RBAC rule, tenant-visible source-list behavior, and generated raw object-key layout. General outbox/broker integration remains future work.
'''
          if arch_marker not in arch_text:
              arch_text = arch_text.rstrip() + arch_section + '\n'
          architecture.write_text(arch_text)

          context_text = repo_context.read_text()
          old_header = '''> Current-state engineering map, audited on 2026-08-22 at `main` commit
> `258d189` (`Merge OPE-304 release system reconciliation`). This describes
> code that exists. Future contracts remain in `PRD.md`, `ARCHITECTURE.md`, and
> the staged roadmap. The workforce OIDC integration-evidence notes below were
> refreshed on 2026-08-23 for V1.1.15 against `main` base `1422834`.
'''
          new_header = '''> Current-state engineering map. The knowledge-upload consistency state was
> refreshed on 2026-08-26 after V1.3.04A merged to `main` as `ae9c2d6`.
> This describes code that exists. Future contracts remain in `PRD.md`,
> `ARCHITECTURE.md`, and the staged roadmap. Earlier subsystem evidence notes
> retain their ticket-specific dates and commit references below.
'''
          if old_header in context_text:
              context_text = context_text.replace(old_header, new_header, 1)
          context_text = context_text.replace(
              '| `migrations` | Alembic schema history | Nine revisions through knowledge permissions |',
              '| `migrations` | Alembic schema history | Ten revisions through durable knowledge-upload cleanup intents |',
              1,
          )

          context_marker = '## V1.3.04A current state — durable knowledge uploads'
          context_section = r'''

## V1.3.04A current state — durable knowledge uploads

File-backed knowledge-source registration now has an implemented cross-store consistency boundary. Before the API attempts the generated raw-object PUT, it commits an internal tenant-owned row in `knowledge_upload_cleanups`. The row stores the exact source/object identity, generated key, retry state, bounded error code, and timestamps needed for later reconciliation.

On confirmed PUT success, the normal `knowledge_sources` insert and cleanup transition to `referenced` occur in the same PostgreSQL transaction. If source persistence fails, the pre-upload intent survives the rollback. The request performs a best-effort immediate delete outside the database transaction, while durable reconciliation remains available when that delete or a follow-up state update fails.

Generic storage PUT failures are treated as outcome-ambiguous rather than assumed absent. `prepared` work has a 15-minute stale deadline; due reconciliation uses the typed object-storage presence check before deletion. Confirmed cleanup retries are bounded: first replay at 30 seconds, then 5 minutes and 30 minutes after failures, with the third failed replay moving to `exhausted`.

Cleanup replay is internal, tenant-scoped, idempotent, and key-validated. Foreign-tenant requests are rejected before storage I/O. Object keys, file data, credentials, and tokens are excluded from cleanup logs/status-count visibility. There is no public cleanup endpoint.

The schema is added by Alembic revision `20260824_0010`. Downgrade refuses to remove the table while unresolved cleanup obligations remain. The worker service itself remains a scaffold; V1.3.04A provides the durable reconciliation service contract but does not claim a general transactional outbox, broker consumer, scheduler, cleanup UI, or resolved-row purge job is deployed.

Primary implementation/evidence files are ADR-018, CCR-006, `KNOWLEDGE_UPLOAD_CONSISTENCY_RUNBOOK.md`, `V1.3.04A_SECURITY_RELIABILITY_REVIEW.md`, the knowledge cleanup/service/repository modules, migration 0010, and the associated PostgreSQL/S3-compatible integration tests.

The exact V1.3.04A implementation head `22ad508fc148f68759b4b0466323e9ce6e452c1c` passed CI and Security before PR #180 merged it into `main` as `ae9c2d67b8e09b3db62e824b7868fa3e163324b0` on 2026-08-26.
'''
          if context_marker not in context_text:
              context_text = context_text.rstrip() + context_section + '\n'
          repo_context.write_text(context_text)
          PY

      - name: Commit cumulative documentation and remove finalizer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v1.3.04a-completion-finalizer.yml
          git add docs/SERVIQ_BUILD_GUIDE.md docs/ARCHITECTURE.md docs/repo_context.md
          git commit -m "docs(v1.3.04a): complete cumulative architecture and build evidence (#178)"
          git push origin HEAD:v1.3.04a-completion
