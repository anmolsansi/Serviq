name: V1.3.04A completion finalizer

on:
  push:
    branches:
      - v1.3.04a-completion

permissions:
  contents: write

jobs:
  finalize-docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: v1.3.04a-completion
          fetch-depth: 0

      - name: Complete V1.3.04A cumulative documentation
        run: python .github/scripts/v1_3_04a_completion.py

      - name: Commit cumulative documentation and remove temporary finalizer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v1.3.04a-completion-finalizer.yml
          git rm .github/scripts/v1_3_04a_completion.py
          git add docs/SERVIQ_BUILD_GUIDE.md docs/ARCHITECTURE.md docs/repo_context.md
          git commit -m "docs(v1.3.04a): complete cumulative architecture and build evidence (#178)"
          git push origin HEAD:v1.3.04a-completion
