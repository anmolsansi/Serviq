name: V1.3.05 completion reconciliation

on:
  push:
    branches:
      - openclawneutron/ope-311-v1305-completion-reconciliation

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.head_commit.message == 'fix(v1.3.05): run completion reconciliation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out reconciliation branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0

      - name: Patch V1.3.05 source-of-truth documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          payload_path = Path('.github/v1305-reconciliation-payload.txt')
          payload = payload_path.read_text(encoding='utf-8')
          roadmap_marker = '===ROADMAP===\n'
          guide_marker = '\n===GUIDE===\n'
          if roadmap_marker not in payload or guide_marker not in payload:
              raise RuntimeError('Reconciliation payload markers are missing')
          roadmap_payload = payload.split(roadmap_marker, 1)[1]
          roadmap_section, guide_completion = roadmap_payload.split(guide_marker, 1)
          roadmap_section = roadmap_section.rstrip() + '\n\n'
          guide_completion = guide_completion.rstrip() + '\n\n'

          remaining_path = Path('docs/SERVIQ_REMAINING_LINEAR_TICKETS_FULL.md')
          remaining = remaining_path.read_text(encoding='utf-8')
          start = '### V1.3.05 — Implement SSRF-safe public knowledge fetch helper'
          end = '### V1.3.06 — Implement source sync command and durable outbox event'
          start_index = remaining.index(start)
          end_index = remaining.index(end, start_index)
          remaining = remaining[:start_index] + roadmap_section + remaining[end_index:]
          remaining_path.write_text(remaining, encoding='utf-8')

          guide_path = Path('docs/SERVIQ_BUILD_GUIDE.md')
          guide = guide_path.read_text(encoding='utf-8')
          completion_heading = '## Completion evidence — 2026-09-01'
          if completion_heading not in guide:
              anchor = '## Rollback and future use\n\nV1.3.05 is additive and owns no durable state.'
              if anchor not in guide:
                  raise RuntimeError('Build-guide rollback anchor not found')
              guide = guide.replace(anchor, guide_completion + anchor, 1)
              guide_path.write_text(guide, encoding='utf-8')

          payload_path.unlink()
          Path('.github/workflows/v1305-completion-reconciliation.yml').unlink()
          PY

      - name: Commit reconciled documentation and remove temporary files
        shell: bash
        run: |
          git config user.name 'serviq-reconciliation-bot'
          git config user.email 'serviq-reconciliation-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'docs(v1.3.05): reconcile completion state'
          git push origin HEAD
