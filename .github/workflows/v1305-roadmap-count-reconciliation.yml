name: "V1.3.05 roadmap count reconciliation"

on:
  push:
    branches:
      - openclawneutron/ope-311-v1305-completion-reconciliation

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reconciliation branch
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0

      - name: Reconcile remaining-ticket inventory
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/SERVIQ_REMAINING_LINEAR_TICKETS_FULL.md')
          text = path.read_text(encoding='utf-8')

          source_block = '| Supplied staged roadmap | 77 | 38 | 41 | 42 | 198 |\n| Repository/acceptance audit discoveries | 6 | 0 | 0 | 0 | 6 |\n| **All remaining tickets below** | **83** | **38** | **41** | **42** | **204** |'
          reconciled_block = '| Supplied staged roadmap | 77 | 38 | 41 | 42 | 198 |\n| Repository/acceptance audit discoveries | 6 | 0 | 0 | 0 | 6 |\n| Completed since consolidation | 1 | 0 | 0 | 0 | 1 |\n| **Current remaining tickets** | **82** | **38** | **41** | **42** | **203** |'
          if source_block not in text:
              raise RuntimeError('Inventory block not found')
          text = text.replace(source_block, reconciled_block, 1)

          old_heading = '### Phase 1 — V1 Production Foundation (77)'
          new_heading = '### Phase 1 — V1 Production Foundation (76 remaining + 1 completed record)'
          if old_heading not in text:
              raise RuntimeError('Phase 1 TOC heading not found')
          text = text.replace(old_heading, new_heading, 1)

          old_toc = '- [V1.3.05 — Implement SSRF-safe public knowledge fetch helper](#v1305-implement-ssrf-safe-public-knowledge-fetch-helper)'
          new_toc = '- [V1.3.05 — Implement SSRF-safe public knowledge fetch helper — COMPLETED 2026-09-01](#v1305-implement-ssrf-safe-public-knowledge-fetch-helper)'
          if old_toc not in text:
              raise RuntimeError('V1.3.05 TOC item not found')
          text = text.replace(old_toc, new_toc, 1)

          marker = '> **Canonical source:** This file contains every remaining ticket in full Linear-style format.\n'
          note = '> **Status reconciliation:** V1.3.05 / OPE-311 completed on 2026-09-01 and is retained below as a completion record for traceability; it is excluded from current remaining-ticket counts.\n'
          if note not in text:
              if marker not in text:
                  raise RuntimeError('Canonical source marker not found')
              text = text.replace(marker, marker + note, 1)

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/v1305-roadmap-count-reconciliation.yml').unlink()
          PY

      - name: Commit count reconciliation and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'serviq-reconciliation-bot'
          git config user.email 'serviq-reconciliation-bot@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m 'docs(v1.3.05): reconcile remaining-ticket counts'
          git push origin HEAD
