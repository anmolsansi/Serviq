name: Validate OPE-253

on:
  pull_request:
    branches:
      - main

jobs:
  client-console:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint Client Console
        run: pnpm --filter @serviq/client-console lint

      - name: Typecheck Client Console
        run: pnpm --filter @serviq/client-console typecheck

      - name: Build Client Console
        run: pnpm --filter @serviq/client-console build

      - name: Verify rendered root page
        shell: bash
        run: |
          pnpm --filter @serviq/client-console dev --hostname 127.0.0.1 > /tmp/serviq-client-console.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000 > /tmp/serviq-client-console.html; then
              break
            fi
            sleep 1
          done
          test -s /tmp/serviq-client-console.html
          grep -q 'Serviq' /tmp/serviq-client-console.html
          grep -q 'Client Console' /tmp/serviq-client-console.html
          if grep -Ei 'Unhandled Runtime Error|Application error|Internal Server Error' /tmp/serviq-client-console.html; then
            echo 'Rendered page contains an application error marker.'
            cat /tmp/serviq-client-console.log
            exit 1
          fi
          cat /tmp/serviq-client-console.log
