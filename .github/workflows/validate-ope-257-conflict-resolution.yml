name: Validate OPE-257 Conflict Resolution

on:
  push:
    branches:
      - ope-257-contracts-package-skeleton

permissions:
  contents: write

jobs:
  validate-contracts-after-main-merge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ope-257-contracts-package-skeleton
          fetch-depth: 0

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        run: npm install --global pnpm@10.15.0

      - name: Regenerate workspace lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck contracts package
        run: pnpm --filter @serviq/contracts typecheck

      - name: Build validation for contracts package
        run: pnpm --filter @serviq/contracts build

      - name: Verify frozen install
        run: pnpm install --frozen-lockfile

      - name: Confirm contracts package does not import applications
        shell: bash
        run: |
          if grep -R --line-number --include='*.ts' -E 'from ["'"'"'].*apps/|from ["'"'"']@serviq/(client-console|customer-web|platform-console)' packages/contracts; then
            echo 'packages/contracts must not import application code.'
            exit 1
          fi

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m 'chore(contracts): reconcile workspace lockfile with main'
          git push origin HEAD:ope-257-contracts-package-skeleton
