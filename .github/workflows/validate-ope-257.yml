name: Validate OPE-257 Contracts Package

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-contracts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        run: npm install --global pnpm@10.15.0

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck contracts package
        run: pnpm --filter @serviq/contracts typecheck

      - name: Build validation for contracts package
        run: pnpm --filter @serviq/contracts build

      - name: Confirm package is workspace-resolvable
        run: pnpm --filter @serviq/contracts exec tsc --version

      - name: Confirm package never imports applications
        shell: bash
        run: |
          if grep -R --line-number --include='*.ts' -E 'from ["'"'"'].*apps/|from ["'"'"']@serviq/(client-console|customer-web|platform-console)' packages/contracts; then
            echo 'packages/contracts must not import application code.'
            exit 1
          fi

      - name: Commit resolved pnpm lockfile
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m 'chore(contracts): lock workspace dependencies'
          git push origin HEAD:${{ github.head_ref }}
