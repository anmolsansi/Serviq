name: Validate OPE-258 Cross-Cutting Packages

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-packages:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install pnpm
        run: npm install --global pnpm@10.15.0

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck config
        run: pnpm --filter @serviq/config typecheck

      - name: Typecheck observability
        run: pnpm --filter @serviq/observability typecheck

      - name: Typecheck security
        run: pnpm --filter @serviq/security typecheck

      - name: Typecheck testkit
        run: pnpm --filter @serviq/testkit typecheck

      - name: Confirm package names resolve
        run: |
          pnpm --filter @serviq/config exec tsc --version
          pnpm --filter @serviq/observability exec tsc --version
          pnpm --filter @serviq/security exec tsc --version
          pnpm --filter @serviq/testkit exec tsc --version

      - name: Confirm packages never import applications
        shell: bash
        run: |
          if grep -R --line-number --include='*.ts' -E 'from ["'"'"'].*apps/|from ["'"'"']@serviq/(client-console|customer-web|platform-console)' packages/config packages/observability packages/security packages/testkit; then
            echo 'Cross-cutting packages must not import application code.'
            exit 1
          fi

      - name: Commit resolved pnpm lockfile
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m 'chore(packages): lock workspace dependencies'
          git push origin HEAD:${{ github.head_ref }}
