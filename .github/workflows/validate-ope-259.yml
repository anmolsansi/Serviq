name: Validate OPE-259 API Scaffold

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-api:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python 3.14.6
        run: uv python install 3.14.6

      - name: Resolve and sync frozen dependency lines
        working-directory: services/api
        run: |
          uv lock --python 3.14.6
          uv sync --group dev --python 3.14.6

      - name: Ruff
        working-directory: services/api
        run: uv run --python 3.14.6 ruff check .

      - name: mypy
        working-directory: services/api
        run: uv run --python 3.14.6 mypy app tests

      - name: pytest
        working-directory: services/api
        run: uv run --python 3.14.6 pytest

      - name: Import smoke check
        working-directory: services/api
        run: uv run --python 3.14.6 python -c 'from app.main import app; assert app.title == "Serviq API"'

      - name: Uvicorn startup smoke check
        working-directory: services/api
        shell: bash
        run: |
          uv run --python 3.14.6 uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/serviq-api.log 2>&1 &
          API_PID=$!
          trap 'kill $API_PID || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/openapi.json >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/serviq-api.log
          exit 1

      - name: Commit resolved uv lockfile
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/api/uv.lock
          git diff --cached --quiet && exit 0
          git commit -m 'chore(api): lock resolved Python dependencies'
          git push origin HEAD:${{ github.head_ref }}
