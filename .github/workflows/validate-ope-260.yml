name: Validate OPE-260 Worker Scaffold

on:
  pull_request:
    branches:
      - ope-259-fastapi-api-scaffold

permissions:
  contents: write

jobs:
  validate-worker:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install Python 3.14.6
        run: uv python install 3.14.6

      - name: Resolve and sync worker dependencies
        working-directory: services/worker
        run: |
          uv lock --python 3.14.6
          uv sync --group dev --python 3.14.6

      - name: Ruff
        working-directory: services/worker
        run: uv run --python 3.14.6 ruff check .

      - name: mypy
        working-directory: services/worker
        run: uv run --python 3.14.6 mypy app tests

      - name: pytest
        working-directory: services/worker
        run: uv run --python 3.14.6 pytest

      - name: Import smoke check
        working-directory: services/worker
        run: uv run --python 3.14.6 python -c 'from app.main import main; assert main() == 0'

      - name: Process start and exit smoke check
        working-directory: services/worker
        run: uv run --python 3.14.6 python -m app.main

      - name: Confirm worker has no web framework imports
        shell: bash
        run: |
          if grep -R --line-number --include='*.py' -E 'from fastapi|import fastapi|APIRouter|Request' services/worker/app; then
            echo 'Worker scaffold must not contain FastAPI/web-route constructs.'
            exit 1
          fi

      - name: Commit resolved worker lockfile
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/worker/uv.lock
          git diff --cached --quiet && exit 0
          git commit -m 'chore(worker): lock resolved Python dependencies'
          git push origin HEAD:${{ github.head_ref }}
