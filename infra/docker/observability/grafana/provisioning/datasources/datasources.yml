apiVersion: 1

datasources:
  - name: Prometheus
    uid: serviq-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: serviq-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: serviq-local

  - name: Tempo
    uid: serviq-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
