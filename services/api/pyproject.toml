[project]
name = "serviq-api"
version = "0.0.0"
description = "Serviq Production V1 API service"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic>=1.16,<2",
  "botocore>=1.42.89,<1.43",
  "fastapi>=0.140.13,<0.141",
  "httpx>=0.28,<1",
  "joserfc>=1.7.4,<2",
  "psycopg[binary]>=3.3,<4",
  "pydantic>=2,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2,<3",
  "uvicorn[standard]>=0.35,<1",
  "valkey>=6.1,<7",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
files = ["app", "tests"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
