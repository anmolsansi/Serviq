[project]
name = "serviq-llm-gateway"
version = "0.0.0"
description = "Serviq provider-neutral LLM gateway service"
requires-python = ">=3.14,<3.15"
dependencies = [
  "anthropic==0.121.0",
  "fastapi>=0.140.13,<0.141",
  "openai==2.53.0",
  "pydantic>=2,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
files = ["app", "tests"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
