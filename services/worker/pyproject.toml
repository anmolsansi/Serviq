[project]
name = "serviq-worker"
version = "0.0.0"
description = "Serviq durable background worker service"
requires-python = ">=3.14,<3.15"
dependencies = [
  "confluent-kafka>=2.15,<3",
  "psycopg[binary]>=3.3,<4",
  "pydantic>=2,<3",
  "sqlalchemy>=2,<3",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
files = ["app", "tests"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
